<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LOOPFALL</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../brand/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#c49bff;--wall:#3d2f73;--hi:#6d5bc4;--lo:#231a47;--bg:#0c0a1d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:#efe6ff;font-family:'Silkscreen',monospace}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hidden{display:none!important}
.pf{font-family:'Press Start 2P',monospace}
button{font-family:'Silkscreen',monospace;font-size:15px;font-weight:700;color:#fff;background:var(--lo);border:0;padding:12px 14px;
  box-shadow:inset 0 0 0 3px var(--hi),0 4px 0 #0006;letter-spacing:1px;cursor:pointer;touch-action:manipulation;border-radius:0;pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px var(--hi),0 1px 0 #0006}
button.big{background:var(--acc);color:#120a24;box-shadow:inset 0 0 0 3px #ffffff55,0 4px 0 #0008;font-size:18px;padding:16px 18px}
button:disabled{opacity:.35}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
#lvName{font-size:11px;line-height:1.5;color:var(--acc);text-shadow:0 2px 0 #0008}
#lvSub{font-size:13px;opacity:.75;margin-top:6px}
#pips{display:flex;gap:6px;margin-top:8px}
.pip{width:9px;height:9px;transform:rotate(45deg);border:2px solid #7ff3ff;opacity:.5}
.pip.on{background:#7ff3ff;opacity:1;box-shadow:0 0 6px #7ff3ff}
.hr{text-align:right}
#moves{font-size:22px;text-shadow:0 2px 0 #0008}
.small{font-size:11px;opacity:.7;margin-top:4px}
.ctrl{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:8px;justify-content:center;pointer-events:none;z-index:2}
.ctrl button{flex:1;max-width:110px;font-size:13px;padding:13px 6px}
#cap{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);text-align:center;font-size:13px;line-height:1.5;color:#fff;text-shadow:0 2px 0 #000a;pointer-events:none;z-index:2;transition:opacity .4s}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);background:#000c;padding:9px 14px;font-size:13px;white-space:nowrap;box-shadow:inset 0 0 0 2px var(--acc);opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
.screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px)}
#title{background:linear-gradient(180deg,var(--bg) 0%,#0000 32%,#0000 52%,var(--bg) 78%);justify-content:space-between;pointer-events:none}
#title > *{pointer-events:auto}
h1{font-family:'Press Start 2P',monospace;font-size:44px;line-height:1.1;margin:10px 0 0;text-align:center;color:#fff;letter-spacing:2px;
  text-shadow:4px 4px 0 var(--wall),8px 8px 0 #0008}
h1 span{color:var(--acc)}
.tag{font-size:13px;opacity:.8;text-align:center;margin:14px 0 0;line-height:1.6}
.menu{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.row{display:flex;gap:10px}
.row button{flex:1}
.stats{font-size:12px;opacity:.75;text-align:center;margin-top:4px}
#levels{background:#000c;overflow-y:auto;touch-action:pan-y}
#levels h2,.card h2{font-family:'Press Start 2P',monospace;font-size:18px;margin:6px 0 18px;color:var(--acc)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px;margin-bottom:20px}
#grid button{aspect-ratio:1;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:'Press Start 2P',monospace;font-size:13px}
#grid .st{display:flex;gap:1px}
.modal{background:#0009;justify-content:center}
.card{background:var(--bg);box-shadow:inset 0 0 0 3px var(--acc),0 8px 0 #0008;padding:26px 22px;width:100%;max-width:330px;text-align:center}
#wStars{display:flex;justify-content:center;gap:10px;margin:4px 0 14px}
#wStars svg{transition:transform .3s}
#wInfo{font-size:14px;line-height:1.7;margin:0 0 20px}
.legend{font-size:11px;opacity:.7;text-align:center;line-height:1.7;max-width:320px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hud hidden">
  <div><div id="lvName" class="pf">01</div><div id="lvSub">PAR 2</div><div id="pips"></div></div>
  <div class="hr"><div id="moves" class="pf">0</div><div class="small">MOVES</div></div>
</div>
<div id="cap"></div>
<div id="toast"></div>
<div id="ctrl" class="ctrl hidden">
  <button id="bMenu">MENU</button>
  <button id="bUndo">UNDO</button>
  <button id="bHint">HINT</button>
  <button id="bReset">RESET</button>
</div>

<div id="title" class="screen">
  <div>
    <h1>LOOP<br><span>FALL</span></h1>
    <p class="tag">swipe to tip the universe.<br>nothing ends. everything falls.</p>
  </div>
  <div class="menu">
    <button id="tPlay" class="big">PLAY</button>
    <div class="row"><button id="tLevels">LEVELS</button><button id="tEndless">ENDLESS</button></div>
    <button id="tDaily">DAILY LOOP</button>
    <div class="row"><button id="tSfx">SFX ON</button><button id="tMusic">MUSIC ON</button></div>
    <div class="stats" id="tStats"></div>
  </div>
</div>

<div id="levels" class="screen hidden">
  <h2>LEVELS</h2>
  <div id="grid"></div>
  <p class="legend">◆ shard &nbsp; ■ stone &nbsp; ✶ thorn<br>blue holds up/down · amber holds sideways</p>
  <button id="lBack">BACK</button>
</div>

<div id="win" class="screen modal hidden">
  <div class="card">
    <h2 id="wTitle">LOOP CLOSED</h2>
    <div id="wStars"></div>
    <p id="wInfo"></p>
    <div class="row"><button id="wRetry">RETRY</button><button id="wNext" class="big">NEXT</button></div>
    <div style="margin-top:12px"><button id="wMenu" style="width:100%">MENU</button></div>
  </div>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
/*__LEVELS__*/
</script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const DX = LF.DX, DY = LF.DY;

// ---------- palettes ----------
const PALS = [
  {bg:'#0c0a1d',wall:'#3d2f73',hi:'#6d5bc4',lo:'#231a47',acc:'#c49bff'}, // dusk
  {bg:'#061318',wall:'#1f5560',hi:'#3fa3a8',lo:'#0f3038',acc:'#7ff3e0'}, // tide
  {bg:'#160913',wall:'#6b2648',hi:'#b34d7a',lo:'#3c1228',acc:'#ff9ec7'}, // rose
  {bg:'#0a0c1e',wall:'#2e3a7a',hi:'#5a6fd6',lo:'#191f47',acc:'#ffd27f'}, // indigo gold
  {bg:'#07120b',wall:'#2c5a33',hi:'#58a35c',lo:'#15301a',acc:'#b7ff9e'}, // moss
  {bg:'#130a06',wall:'#6b3a1f',hi:'#c2703a',lo:'#3a1d0e',acc:'#ffb070'}, // ember
  {bg:'#090e16',wall:'#3a5878',hi:'#7fa6cf',lo:'#1f3045',acc:'#cfe8ff'}, // ice
];
const STAGE_PAL = {hand:0,shards:0,crate:1,spike:2,phase:3,mixed:4,hard:5};
let PAL = PALS[0];
function setPal(i){
  PAL = PALS[((i%PALS.length)+PALS.length)%PALS.length];
  const r = document.documentElement.style;
  r.setProperty('--acc',PAL.acc); r.setProperty('--wall',PAL.wall); r.setProperty('--hi',PAL.hi);
  r.setProperty('--lo',PAL.lo); r.setProperty('--bg',PAL.bg);
}

// ---------- save ----------
const SAVE_KEY = 'loopfall-v1';
let save = {stars:{}, endBest:0, endStars:0, daily:{}, sfx:true, music:true};
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- audio ----------
let AC = null, master, sfxG, musG, noiseBuf, musTimer = null, musNext = 0, musStep = 0;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(()=>{}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    sfxG = AC.createGain(); sfxG.gain.value = save.sfx ? 1 : 0; sfxG.connect(master);
    musG = AC.createGain(); musG.gain.value = save.music ? 0.2 : 0; musG.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, slide, when, dest){
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq, when){
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
  const gn = AC.createGain(); gn.gain.setValueAtTime(vol || 0.2, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(gn); gn.connect(sfxG); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  swipe(){ noise(0.12, 0.08, 2400); tone(520, 0.08, 'square', 0.04, 260); },
  bump(){ tone(110, 0.08, 'square', 0.08, 70); },
  land(heavy){ tone(heavy ? 90 : 140, 0.12, 'triangle', 0.3, heavy ? 45 : 70); noise(0.06, 0.06, 500); },
  shard(n){ const sc = [659, 784, 880, 1047, 1175, 1319, 1568]; const f = sc[Math.min(n, sc.length - 1)];
    tone(f, 0.18, 'square', 0.07); tone(f * 2, 0.12, 'triangle', 0.05, null, 0.05); },
  open(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.06)); },
  win(){ [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => { tone(f, 0.3, 'square', 0.06, null, i * 0.07); tone(f / 2, 0.3, 'triangle', 0.08, null, i * 0.07); }); },
  dead(){ noise(0.35, 0.3, 900); tone(200, 0.3, 'sawtooth', 0.08, 50); },
  loop(){ tone(440, 0.8, 'triangle', 0.12, 55); tone(447, 0.8, 'square', 0.03, 56); },
  rewind(){ tone(300, 0.15, 'triangle', 0.08, 900); },
  lost(){ tone(300, 0.5, 'triangle', 0.07, 60); },
  click(){ tone(880, 0.04, 'square', 0.05); },
};
// gentle generative chiptune, A minor pentatonic over Am F C G
function startMusic(){
  if (!AC || musTimer) return;
  musNext = AC.currentTime + 0.1; musStep = 0;
  const chords = [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
  const bass = [110, 87.3, 130.8, 98];
  const penta = [440, 523.3, 587.3, 659.3, 784, 880, 1046.5];
  const eighth = 60 / 96 / 2;
  musTimer = setInterval(() => {
    if (!AC) return;
    while (musNext < AC.currentTime + 0.25) {
      const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8, t = musNext - AC.currentTime;
      if (beat === 0 || beat === 4) tone(bass[bar], 0.5, 'triangle', 0.35, null, t, musG);
      if (Math.random() < (beat % 2 ? 0.35 : 0.7)) {
        const pool = Math.random() < 0.6 ? chords[bar].map(f => f * 2) : penta;
        tone(pool[Math.floor(Math.random() * pool.length)], 0.22, beat % 2 ? 'triangle' : 'square', 0.06, null, t, musG);
      }
      if (beat === 6 && Math.random() < 0.25) tone(penta[6] * (Math.random() < 0.5 ? 1 : 1.5), 0.4, 'triangle', 0.04, null, t, musG);
      musNext += eighth; musStep++;
    }
  }, 60);
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend().catch(()=>{}); else AC.resume().catch(()=>{});
});

// ---------- canvas ----------
const cv = $('c'), ctx = cv.getContext('2d');
const lo = document.createElement('canvas'), g = lo.getContext('2d');
const layer = document.createElement('canvas'), lg = layer.getContext('2d');
let S = 4, DPR = 1, baseOx = 0, baseOy = 0, LW = 64, LH = 64;
let stars = [];

const G = {
  mode: 'title', kind: 'demo', L: null, idx: 0, st: null, hist: [], g: 2, anim: null, queue: null,
  dmask: 0, over: false, hinted: false, hintDir: -1, depth: 1, sq: 0, trail: [], particles: [],
  shake: 0, flash: 0, flashCol: '#fff', intro: 0, playerHidden: false, winAt: 0, lean: [0, 0], demoAt: 0, demoI: 0,
};

function fit(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const W = innerWidth, H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (!G.L) return;
  LW = G.L.w * 8; LH = G.L.h * 8;
  const topR = G.mode === 'title' ? H * 0.30 : 96, botR = G.mode === 'title' ? H * 0.44 : 128;
  const aw = W * 0.76, ah = Math.max(90, H - topR - botR);
  S = Math.max(2, Math.min(Math.floor(DPR * 5.5), Math.floor(Math.min(aw * DPR / LW, ah * DPR / LH))));
  lo.width = Math.ceil(cv.width / S); lo.height = Math.ceil(cv.height / S);
  baseOx = Math.floor((lo.width - LW) / 2);
  baseOy = Math.floor((topR + ah / 2) * DPR / S - LH / 2);
  initStars();
}
window.addEventListener('resize', fit);

function initStars(){
  stars = [];
  const n = Math.floor(lo.width * lo.height / 120);
  for (let i = 0; i < n; i++) stars.push({x: Math.random() * lo.width, y: Math.random() * lo.height, z: Math.random(), tw: Math.random() * 6.28});
}

// ---------- level layer ----------
const PH = {b: {m: '#2f8fe0', hi: '#9ad6ff', lo: '#164a78'}, o: {m: '#e0892f', hi: '#ffd59a', lo: '#7a4214'}};
function tileAt(x, y){ const L = G.L; return L.tiles[((y % L.h) + L.h) % L.h * L.w + ((x % L.w) + L.w) % L.w]; }
function hash(x, y){ let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; }
function buildLayer(){
  const L = G.L; layer.width = LW; layer.height = LH;
  lg.clearRect(0, 0, LW, LH);
  lg.fillStyle = 'rgba(255,255,255,0.035)'; lg.fillRect(0, 0, LW, LH);
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const t = L.tiles[y * L.w + x], px = x * 8, py = y * 8;
    if (t === '#') {
      lg.fillStyle = PAL.wall; lg.fillRect(px, py, 8, 8);
      const up = tileAt(x, y - 1) === '#', dn = tileAt(x, y + 1) === '#', lf = tileAt(x - 1, y) === '#', rt = tileAt(x + 1, y) === '#';
      lg.fillStyle = PAL.hi; if (!up) lg.fillRect(px, py, 8, 1); if (!lf) lg.fillRect(px, py, 1, 8);
      lg.fillStyle = PAL.lo; if (!dn) lg.fillRect(px, py + 7, 8, 1); if (!rt) lg.fillRect(px + 7, py, 1, 8);
      const h = hash(x, y);
      lg.fillStyle = PAL.lo; lg.fillRect(px + 2 + (h % 4), py + 2 + ((h >> 3) % 4), 1, 1);
      if (h % 3 === 0) { lg.fillStyle = PAL.hi; lg.fillRect(px + 2 + ((h >> 5) % 4), py + 2 + ((h >> 8) % 4), 1, 1); }
    } else if (t === 'b' || t === 'o') {
      const c = PH[t], active = LF.solidFor(t, G.g);
      if (active) {
        lg.fillStyle = c.m; lg.fillRect(px, py, 8, 8);
        lg.fillStyle = c.hi; lg.fillRect(px, py, 8, 1); lg.fillRect(px, py, 1, 8);
        lg.fillStyle = c.lo; lg.fillRect(px, py + 7, 8, 1); lg.fillRect(px + 7, py, 1, 8);
        lg.fillStyle = c.hi; if (t === 'b') lg.fillRect(px + 3, py + 2, 2, 4); else lg.fillRect(px + 2, py + 3, 4, 2);
      } else {
        lg.globalAlpha = 0.55; lg.fillStyle = c.m;
        for (let k = 0; k < 8; k += 2) { lg.fillRect(px + k, py, 1, 1); lg.fillRect(px + 7 - k, py + 7, 1, 1); lg.fillRect(px, py + 7 - k, 1, 1); lg.fillRect(px + 7, py + k, 1, 1); }
        lg.globalAlpha = 0.35; if (t === 'b') lg.fillRect(px + 3, py + 2, 2, 4); else lg.fillRect(px + 2, py + 3, 4, 2);
        lg.globalAlpha = 1;
      }
    } else if (t === 'x') {
      // thorn: drawn dynamically for flicker; base here
    } else {
      lg.fillStyle = 'rgba(255,255,255,0.12)'; lg.fillRect(px, py, 1, 1);
    }
  }
}

// ---------- sprites ----------
const THORN = ['...#...', '.#.#.#.', '..###..', '#######', '..###..', '.#.#.#.', '...#...'];
const ARROW = ['..###..', '..###..', '..###..', '#######', '.#####.', '..###..', '...#...'];
const STAR9 = ['....#....', '....#....', '...###...', '#########', '.#######.', '..#####..', '..##.##..', '.##...##.', '.#.....#.'];
const RING = []; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const d = Math.hypot(x - 3.5, y - 3.5); if (d > 2.4 && d < 3.7) RING.push([x, y, Math.atan2(y - 3.5, x - 3.5)]); }

function drawThorn(x, y, now){
  const f = (Math.sin(now / 160 + x * 0.3) + 1) / 2;
  for (let j = 0; j < 7; j++) for (let i = 0; i < 7; i++) if (THORN[j][i] === '#') {
    const edge = (i === 3 && (j === 0 || j === 6)) || (j === 3 && (i === 0 || i === 6));
    g.fillStyle = edge ? '#ffb3c4' : (i === 3 && j === 3 ? (f > 0.5 ? '#fff' : '#ff9cb5') : '#ff3d6b');
    g.fillRect(x + i, y + j, 1, 1);
  }
}
function drawShard(x, y, now, s){
  const bob = Math.round(Math.sin(now / 260 + s * 1.7));
  const rows = [[3, 2], [2, 4], [1, 6], [2, 4], [3, 2]];
  for (let j = 0; j < rows.length; j++) { g.fillStyle = j < 2 ? '#bff9ff' : (j === 2 ? '#7ff3ff' : '#2aa7c9'); g.fillRect(x + rows[j][0], y + 1 + j + bob, rows[j][1], 1); }
  g.fillStyle = '#fff'; g.fillRect(x + 3, y + 2 + bob, 1, 1);
  if (((now / 90 + s * 7) | 0) % 23 === 0) { g.fillStyle = '#fff'; g.fillRect(x + 7, y + bob, 1, 1); g.fillRect(x, y + 6 + bob, 1, 1); }
}
function drawExit(x, y, now, open){
  if (open) {
    g.fillStyle = PAL.acc; g.globalAlpha *= 0.25; g.fillRect(x - 1, y - 1, 10, 10); g.globalAlpha /= 0.25;
    g.fillStyle = '#120a24'; g.fillRect(x + 2, y + 2, 4, 4);
    for (const [i, j, a] of RING) { const v = (Math.sin(a * 2 - now / 120) + 1) / 2; g.fillStyle = v > 0.66 ? '#fff' : v > 0.33 ? PAL.acc : PAL.hi; g.fillRect(x + i, y + j, 1, 1); }
    const p = ((now / 140) | 0) % 4; g.fillStyle = PAL.acc; g.fillRect(x + 3 + (p % 2), y + 3 + (p >> 1), 1, 1);
  } else {
    for (const [i, j] of RING) { g.fillStyle = '#4b4566'; g.fillRect(x + i, y + j, 1, 1); }
    g.fillStyle = '#2a2540'; g.fillRect(x + 3, y + 3, 2, 2);
  }
}
function drawCrate(x, y){
  g.fillStyle = '#8b7fa8'; g.fillRect(x, y, 8, 8);
  g.fillStyle = '#d6cdee'; g.fillRect(x, y, 8, 1); g.fillRect(x, y, 1, 8);
  g.fillStyle = '#463c5e'; g.fillRect(x, y + 7, 8, 1); g.fillRect(x + 7, y, 1, 8);
  g.fillStyle = '#5c5078'; g.fillRect(x + 2, y + 2, 4, 4);
  g.fillStyle = PAL.acc; g.fillRect(x + 3, y + 3, 2, 2);
}
function drawPlayer(x, y, gd, sq, now, scale){
  let bx = 1, by = 1, bw = 6, bh = 6;
  const s = Math.round(sq * 2);
  if (gd % 2 === 0) { bh -= s; bw += s; bx -= Math.floor(s / 2); by = gd === 2 ? 7 - bh : 1; }

  // copies helper
  const each = (px, py, fn) => {
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const X = Math.round(ox + px + i * LW), Y = Math.round(oy + py + j * LH);
      if (X < -12 || Y < -12 || X > W + 4 || Y > H + 4) continue;
      const rx = Math.floor((X + 4 - ox) / LW), ry = Math.floor((Y + 4 - oy) / LH), r = Math.max(Math.abs(rx), Math.abs(ry));
      const a = RA[Math.min(r, 4)] * iAlpha(r);
      if (a <= 0.01) continue;
      g.globalAlpha = a; fn(X, Y, r);
    }
  };
  const L = G.L, allMask = (1 << L.shards.length) - 1;
  // thorns + exit
  for (let k = 0; k < L.tiles.length; k++) {
    const t = L.tiles[k]; if (t !== 'x' && t !== 'E') continue;
    const px = (k % L.w) * 8, py = Math.floor(k / L.w) * 8;
    if (t === 'x') each(px, py, (X, Y) => drawThorn(X, Y, now));
    else each(px, py, (X, Y) => drawExit(X, Y, now, G.dmask === allMask));
  }
  if (G.dmask === allMask && !G.over && Math.random() < dt / 120) {
    const k = L.tiles.indexOf('E'); if (k >= 0) G.particles.push({x: (k % L.w) * 8 + 4, y: Math.floor(k / L.w) * 8 + 4, vx: (Math.random() - 0.5) * 0.03, vy: (Math.random() - 0.5) * 0.03, life: 500, max: 500, col: PAL.acc, gx: 0, gy: 0});
  }
  // shards
  L.shards.forEach((s, i) => { if (!(G.dmask & (1 << i))) each(s[0] * 8, s[1] * 8, (X, Y) => drawShard(X, Y, now, i)); });
  // crates
  drawCrates(A, T, each);
  // player
  G.sq = Math.max(0, G.sq - dt / 170);
  let pp = G.st.p;
  if (A) pp = posAt(A, A.r.paths[0], T);
  const ppx = pp[0] * 8, ppy = pp[1] * 8;
  if (moving && !G.playerHidden) { G.trail.push({x: ppx, y: ppy, a: 0.5}); }
  for (const tr of G.trail) tr.a -= dt / 260;
  G.trail = G.trail.filter(tr => tr.a > 0);
  if (!G.playerHidden) {
    let pa = 1, sc = 1;
    if (A && A.r.result === 'loop' && T > A.total) pa = Math.max(0, 1 - (T - A.total) / 600);
    if (G.winAt) { sc = Math.max(0, 1 - (now - G.winAt) / 400); }
    // trail
    for (const tr of G.trail) {
      each(tr.x, tr.y, (X, Y) => { g.globalAlpha *= tr.a * pa; g.fillStyle = '#ffd38a'; g.fillRect(X + 2, Y + 2, 4, 4); });
    }
    if (sc > 0 && pa > 0) {
      // glow on central instance
      each(ppx, ppy, (X, Y, r) => {
        const base = g.globalAlpha;
        if (r === 0) { g.globalAlpha = base * 0.08 * pa; g.fillStyle = '#ffd38a'; g.fillRect(X - 4, Y - 4, 16, 16); g.globalAlpha = base * 0.12 * pa; g.fillRect(X - 2, Y - 2, 12, 12); }
        g.globalAlpha = base * pa; drawPlayer(X, Y, G.g, G.sq, now, sc);
      });
    }
  }
  // hint arrow
  if (G.hintDir >= 0 && !A && !G.over) {
    const b = Math.round((Math.sin(now / 150) + 1));
    const X = Math.round(ox + ppx + DX[G.hintDir] * (10 + b)), Y = Math.round(oy + ppy + DY[G.hintDir] * (10 + b));
    g.globalAlpha = 0.6 + 0.4 * Math.sin(now / 120); drawPattern(ARROW, X, Y, '#ffffff', G.hintDir);
  }
  // particles
  for (const p of G.particles) { p.vx += p.gx * dt; p.vy += p.gy * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const p of G.particles) { g.globalAlpha = Math.min(1, p.life / p.max * 1.5); g.fillStyle = p.col; g.fillRect(Math.round(ox + p.x), Math.round(oy + p.y), 1, 1); }
  // center frame brackets
  g.globalAlpha = 0.5 * ie; g.fillStyle = PAL.acc;
  const fx = ox - 3, fy = oy - 3, fw = LW + 6, fh = LH + 6;
  g.fillRect(fx, fy, 5, 1); g.fillRect(fx, fy, 1, 5); g.fillRect(fx + fw - 5, fy, 5, 1); g.fillRect(fx + fw - 1, fy, 1, 5);
  g.fillRect(fx, fy + fh - 1, 5, 1); g.fillRect(fx, fy + fh - 5, 1, 5); g.fillRect(fx + fw - 5, fy + fh - 1, 5, 1); g.fillRect(fx + fw - 1, fy + fh - 5, 1, 5);
  // gravity marker on bracket side
  g.globalAlpha = 0.85 * ie;
  const gx = ox + LW / 2 + DX[G.g] * (LW / 2 + 6) - 3, gy = oy + LH / 2 + DY[G.g] * (LH / 2 + 6) - 3;
  drawPattern(ARROW, Math.round(gx), Math.round(gy), PAL.acc, G.g);
  // vignette + flash
  g.globalAlpha = 1;
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const fa = 1 - (now - G.flash) / 260;
  if (fa > 0) { g.globalAlpha = fa * 0.22; g.fillStyle = G.flashCol; g.fillRect(0, 0, W, H); }
  g.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lo, 0, 0, W * S, H * S);
}
function drawCrates(A, T, each){
  if (A) {
    A.r.paths.forEach((p, i) => {
      if (i === 0) return;
      let fade = 1;
      if (!A.r.alive[i]) fade = Math.max(0, 1 - Math.max(0, T - A.total) / 300);
      if (fade <= 0) return;
      const q = posAt(A, p, T);
      each(q[0] * 8, q[1] * 8, (X, Y) => { g.globalAlpha *= fade; drawCrate(X, Y); });
    });
  } else {
    for (const c of G.st.c) each(c[0] * 8, c[1] * 8, (X, Y) => drawCrate(X, Y));
  }
}

// boot
setPal(0); startDemo(); showScreen('title');
requestAnimationFrame(frame);
window.__G = G; window.__tryMove = tryMove;
})();
