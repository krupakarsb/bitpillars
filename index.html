<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root { --gold:#ffcf5a; --gold-dk:#c97a18; --cream:#f4efe6; --ink:#0b0a1f; --orb:220px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1d3340; color:var(--cream);
    font-family:'Silkscreen',monospace; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  #wall { position:fixed; inset:0; width:100%; height:100%; image-rendering:pixelated; display:block; }
  .vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(8,10,24,.45) 100%),
               linear-gradient(180deg, rgba(8,10,24,.55) 0%, rgba(8,10,24,0) 22%); }

  /* ---------- header ---------- */
  .brand { position:fixed; z-index:5; top:max(18px, env(safe-area-inset-top)); left:clamp(16px,4vw,48px);
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--cream); }
  .brand img { width:52px; height:52px; border-radius:50%; image-rendering:pixelated;
    box-shadow:0 0 0 3px var(--gold), 0 0 0 6px rgba(11,10,31,.75), 0 0 24px rgba(255,207,90,.45); }
  .brand span { font-family:'Jersey 10','Silkscreen',monospace; font-size:40px; letter-spacing:3px; line-height:1;
    text-shadow:3px 3px 0 rgba(11,10,31,.75); }
  .links { position:fixed; z-index:5; top:max(26px, env(safe-area-inset-top)); right:clamp(16px,4vw,48px); display:flex; gap:10px; }
  .chip { font-family:'Silkscreen',monospace; font-size:13px; color:var(--cream); text-decoration:none; padding:9px 12px;
    background:rgba(11,10,31,.55); box-shadow:inset 0 0 0 2px rgba(255,207,90,.55); backdrop-filter:blur(2px); }
  .chip:hover { background:rgba(11,10,31,.8); }

  /* ---------- game title ---------- */
  .info { position:fixed; z-index:4; left:50%; transform:translateX(-50%); text-align:center; width:min(92vw,640px); pointer-events:none; }
  .info > div { transition:opacity .2s; }
  .info h1 { margin:0; font-family:'Jersey 10','Silkscreen',monospace; font-weight:400; font-size:clamp(44px,6.5vw,78px);
    letter-spacing:4px; line-height:1; color:var(--cream); text-shadow:4px 4px 0 rgba(11,10,31,.8), 0 0 30px rgba(255,207,90,.35); transition:opacity .2s; }
  .info p { margin:8px 0 0; font-size:clamp(12px,1.25vw,15px); color:#fff3d6; text-shadow:2px 2px 0 rgba(11,10,31,.8); }

  /* ---------- stage ---------- */
  .stage { position:fixed; inset:0; z-index:3; }
  .pedestal { position:absolute; left:50%; bottom:2vh; transform:translateX(-50%); image-rendering:pixelated; pointer-events:none;
    filter:drop-shadow(0 18px 24px rgba(8,10,24,.55)); animation:bob 5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { translate:0 0; } 50% { translate:0 -8px; } }
  .beam { display:none; position:absolute; left:50%; width:10px; transform:translateX(-50%); pointer-events:none;
    background:linear-gradient(0deg, rgba(255,207,90,.0), rgba(255,207,90,.55)); filter:blur(2px); animation:bob 5s ease-in-out infinite; }
  .orb { position:absolute; left:0; top:0; width:var(--orb); height:var(--orb); border-radius:50%; padding:0; border:0; cursor:pointer;
    background:#0b0a1f; overflow:hidden; will-change:transform,opacity;
    box-shadow:0 0 0 4px rgba(244,239,230,.75), 0 0 0 8px rgba(11,10,31,.6), 0 14px 30px rgba(8,10,24,.5); }
  .orb img { width:100%; height:100%; object-fit:cover; image-rendering:pixelated; display:block; }
  .orb.center { box-shadow:0 0 0 6px var(--gold), 0 0 0 10px rgba(11,10,31,.75), 0 0 0 12px var(--gold-dk), 0 0 60px rgba(255,207,90,.6); }
  .orb.soon { background:radial-gradient(circle at 35% 30%, #3a3466 0%, #17142f 60%, #0b0a1f 100%); }
  .orb.soon .q { position:absolute; inset:0; display:grid; place-items:center; font-family:'Jersey 10','Silkscreen',monospace;
    font-size:calc(var(--orb) * .5); color:rgba(255,207,90,.55); text-shadow:4px 4px 0 rgba(0,0,0,.4); }
  .orb.soon::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px); }
  .orb.shake { animation:shake .35s; }
  @keyframes shake { 20%,60% { margin-left:-8px } 40%,80% { margin-left:8px } }

  .arrow { position:absolute; z-index:4; width:58px; height:58px; border:0; cursor:pointer; padding:0;
    background:rgba(11,10,31,.65); box-shadow:inset 0 0 0 3px var(--gold), 0 4px 0 rgba(0,0,0,.35); display:grid; place-items:center; }
  .arrow:hover { background:rgba(11,10,31,.85); }
  .arrow:active { transform:translateY(3px); box-shadow:inset 0 0 0 3px var(--gold), 0 1px 0 rgba(0,0,0,.35); }
  .arrow svg { width:24px; height:24px; image-rendering:pixelated; }
  .play { position:relative; pointer-events:auto; margin-top:16px; font-family:'Silkscreen',monospace; font-size:17px; font-weight:700;
    color:var(--ink); background:var(--gold); border:0; padding:13px 22px; cursor:pointer; letter-spacing:1px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.45), 0 5px 0 var(--gold-dk), 0 0 24px rgba(255,207,90,.45); }
  .play:active { margin-top:3px; box-shadow:inset 0 0 0 3px rgba(255,255,255,.45), 0 2px 0 var(--gold-dk); }
  .play[disabled] { background:#6d6789; color:#d8d3ea; box-shadow:inset 0 0 0 3px rgba(255,255,255,.2), 0 5px 0 #3e3a57; cursor:default; }
  .dots { display:flex; gap:8px; justify-content:center; margin-top:16px; }
  .dots i { width:9px; height:9px; background:rgba(244,239,230,.45); box-shadow:0 0 0 2px rgba(11,10,31,.5); }
  .dots i.on { background:var(--gold); }
  .hint { position:fixed; z-index:4; bottom:max(14px, env(safe-area-inset-bottom)); left:clamp(16px,4vw,48px); font-size:11px; color:rgba(255,243,214,.8); text-shadow:2px 2px 0 rgba(11,10,31,.8); }
  footer { position:fixed; z-index:4; bottom:max(14px, env(safe-area-inset-bottom)); right:clamp(16px,4vw,48px); font-size:11px; color:rgba(255,243,214,.85);
    text-shadow:2px 2px 0 rgba(11,10,31,.8); }
  footer a { color:var(--gold); text-decoration:none; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  @media (max-width:700px) {
    .brand img { width:40px; height:40px; } .brand span { font-size:30px; letter-spacing:2px; }
    .links { display:none; } .hint { display:none; }
    .arrow { width:46px; height:46px; } .arrow svg { width:20px; height:20px; }
    footer { left:0; right:0; text-align:center; }
    .play { font-size:15px; padding:12px 18px; }
  }
  @media (prefers-reduced-motion:reduce) { .pedestal, .beam { animation:none; } }
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>
<div class="vignette"></div>

<a class="brand" href="./" aria-label="BitPillars home">
  <img src="brand/bitpillars-pfp-256.png" alt="">
  <span>BITPILLARS</span>
</a>
<nav class="links">

<div class="info" id="info"><div aria-live="polite"><h1 id="gTitle">LOOPFALL</h1><p id="gGenre"></p></div><button class="play" id="play">▶ PLAY</button><div class="dots" id="dots"></div></div>

<main class="stage" id="stage">
  <div class="beam" id="beam"></div>
  <img class="pedestal" id="pedestal" src="brand/bitpillars-pedestal.svg" alt="">
  <button class="arrow" id="prev" aria-label="Previous game"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M5 1h1v1H5zM4 2h1v1H4zM3 3h1v2H3zM4 5h1v1H4zM5 6h1v1H5z" fill="#ffcf5a"/><path d="M5 2h1v1H5zM4 3h1v2H4zM5 5h1v1H5z" fill="#fff4c9"/></svg></button>
  <button class="arrow" id="next" aria-label="Next game"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M2 1h1v1H2zM3 2h1v1H3zM4 3h1v2H4zM3 5h1v1H3zM2 6h1v1H2z" fill="#ffcf5a"/><path d="M2 2h1v1H2zM3 3h1v2H3zM2 5h1v1H2z" fill="#fff4c9"/></svg></button>
</main>

<div class="hint">scroll · arrows · swipe</div>

<script>
// ---------------------------------------------------------------- games
// To add a game: put it in its own folder and add an entry here (img should be a 16:10 screenshot).
const GAMES = [
  { title:'LOOPFALL', genre:'Gravity puzzle · 28 levels · endless mode', href:'loopfall/index.html', img:'loopfall/docs/thumb.png' },
  { title:'???', genre:'Coming soon · stay tuned', soon:true },
  { title:'???', genre:'Coming soon · stay tuned', soon:true },
  { title:'???', genre:'Coming soon · stay tuned', soon:true },
  { title:'???', genre:'Coming soon · stay tuned', soon:true },
];

// ---------------------------------------------------------------- carousel
(function () {
  const stage = document.getElementById('stage'), ped = document.getElementById('pedestal'), beam = document.getElementById('beam');
  const prev = document.getElementById('prev'), next = document.getElementById('next'), play = document.getElementById('play');
  const info = document.getElementById('info'), infoText = info.firstElementChild, gTitle = document.getElementById('gTitle'), gGenre = document.getElementById('gGenre');
  const dotsEl = document.getElementById('dots');
  const N = GAMES.length;
  let c = 0, target = 0, shown = -1, geo = null;

  const orbs = GAMES.map((g, i) => {
    const b = document.createElement('button');
    b.className = 'orb' + (g.soon ? ' soon' : '');
    b.setAttribute('aria-label', g.soon ? 'Coming soon' : g.title);
    b.innerHTML = g.soon ? '<span class="q">?</span>' : `<img src="${g.img}" alt="">`;
    b.addEventListener('click', () => {
      const d = wrapDist(i, c);
      if (Math.abs(d) < 0.5) launch(); else go(target + Math.round(d));
    });
    stage.appendChild(b);
    const dot = document.createElement('i'); dotsEl.appendChild(dot);
    return b;
  });
  const dots = [...dotsEl.children];

  function wrapDist(i, cc) { let d = ((i - cc) % N + N) % N; if (d > N / 2) d -= N; return d; }
  function go(t) { target = t; }
  function cur() { return ((Math.round(target) % N) + N) % N; }
  function launch() {
    const g = GAMES[cur()];
    if (g.soon) { const o = orbs[cur()]; o.classList.remove('shake'); void o.offsetWidth; o.classList.add('shake'); return; }
    location.href = g.href;
  }

  function layout() {
    const W = innerWidth, H = innerHeight, mobile = W < 700;
    const pedH = Math.min(mobile ? H * 0.38 : H * 0.46, 440, W * (mobile ? 0.95 : 0.6));
    ped.style.height = pedH + 'px'; ped.style.width = pedH + 'px';
    const orb = Math.round(Math.max(130, Math.min(mobile ? W * 0.44 : 250, H * 0.27)));
    document.documentElement.style.setProperty('--orb', orb + 'px');
    const pedTop = H - H * 0.02 - pedH;
    const obeliskTop = pedTop + pedH * (9 / 64);             // tip of the obelisk inside the art
    const cy = obeliskTop - orb / 2 + orb * 0.05;
    const spacing = mobile ? orb * 0.95 : Math.min(orb * 1.25, W * 0.17);
    beam.style.top = (cy + orb / 2) + 'px'; beam.style.height = (obeliskTop - cy - orb / 2 + pedH * 0.04) + 'px';
    info.style.top = Math.max(mobile ? 72 : 70, cy - orb / 2 - info.offsetHeight - (mobile ? 34 : 42)) + 'px';
    const arrowY = cy - (mobile ? 23 : 29);
    const ax = mobile ? 10 : Math.max(24, W / 2 - spacing * 2.6 - 80);
    prev.style.left = ax + 'px'; next.style.right = ax + 'px'; prev.style.top = next.style.top = arrowY + 'px';
    geo = { W, cy, orb, spacing, mobile };
  }

  function frame() {
    requestAnimationFrame(frame);
    if (!geo) return;
    c += (target - c) * 0.16;
    if (Math.abs(target - c) < 0.001) c = target;
    const { W, cy, orb, spacing, mobile } = geo;
    orbs.forEach((o, i) => {
      const d = wrapDist(i, c), ad = Math.abs(d);
      const s = ad < 1 ? 1 - 0.45 * ad : Math.max(0.3, 0.55 - 0.1 * (ad - 1));
      const x = W / 2 + Math.sign(d) * (ad < 1 ? ad * spacing : spacing + (ad - 1) * spacing * 0.78);
      const y = cy + Math.min(ad, 1) * orb * 0.42 + Math.max(0, ad - 1) * orb * 0.06;
      const vis = mobile ? 1.6 : 2.6;
      o.style.transform = `translate(${x - orb / 2}px, ${y - orb / 2}px) scale(${s})`;
      o.style.opacity = ad > vis ? 0 : ad > vis - 0.6 ? (vis - ad) / 0.6 : ad < 0.5 ? 1 : 0.92;
      o.style.zIndex = 100 - Math.round(ad * 10);
      o.style.pointerEvents = ad > vis ? 'none' : 'auto';
      o.classList.toggle('center', ad < 0.5);
      o.style.filter = ad < 0.5 ? 'none' : `brightness(${Math.max(0.55, 0.95 - ad * 0.15)})`;
    });
    const k = cur();
    if (k !== shown) {
      shown = k; const g = GAMES[k];
      infoText.style.opacity = 0;
      setTimeout(() => { gTitle.textContent = g.title; gGenre.textContent = g.genre; infoText.style.opacity = 1; }, 120);
      play.textContent = g.soon ? 'IN THE FORGE' : '▶ PLAY'; play.disabled = !!g.soon;
      dots.forEach((dd, j) => dd.classList.toggle('on', j === k));
    }
  }

  prev.onclick = () => go(target - 1);
  next.onclick = () => go(target + 1);
  play.onclick = launch;
  document.getElementById('random').onclick = () => { const ready = GAMES.filter(g => !g.soon); location.href = ready[Math.floor(Math.random() * ready.length)].href; };
  let acc = 0, last = 0;
  addEventListener('wheel', e => {
    e.preventDefault();
    acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    const now = performance.now();
    if (Math.abs(acc) > 40 && now - last > 220) { go(target + Math.sign(acc)); acc = 0; last = now; }
  }, { passive:false });
  let tx = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
  addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) go(target + (dx < 0 ? 1 : -1)); tx = null; });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(target + 1);
    else if (e.key === 'ArrowLeft') go(target - 1);
    else if (e.key === 'Enter' && document.activeElement === document.body) launch();
  });
  addEventListener('resize', layout);
  ped.complete ? layout() : ped.addEventListener('load', layout); layout();
  requestAnimationFrame(frame);
})();

// ---------------------------------------------------------------- live wallpaper: pixel cherry-blossom forest
(function () {
  const cv = document.getElementById('wall'), g = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, PX, layers = [], petals = [], motes = [], mx = 0.5;
  const hash = (a, b) => { let h = a * 374761393 + b * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; };
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));

  function sky(c) {
    const x = c.getContext('2d'), img = x.createImageData(c.width, c.height), d = img.data;
    const stops = [[0, '#1d3340'], [0.25, '#2f5a63'], [0.5, '#5f9a92'], [0.66, '#9fcfbf'], [0.78, '#b8dcc8'], [1, '#6f9e7c']].map(s => [s[0], hex(s[1])]);
    for (let y = 0; y < c.height; y++) {
      const t = y / c.height; let k = 0; while (k < stops.length - 2 && stops[k + 1][0] < t) k++;
      const a = stops[k], b = stops[k + 1], f = (t - a[0]) / (b[0] - a[0]);
      for (let xx = 0; xx < c.width; xx++) {
        const th = (BAY[(y & 3) * 4 + (xx & 3)] / 16 - 0.5) * 12, o = (y * c.width + xx) * 4;
        for (let i = 0; i < 3; i++) d[o + i] = Math.round((a[1][i] + (b[1][i] - a[1][i]) * f + th) / 8) * 8;
        d[o + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
  }
  function blob(x, cx, cy, r, cols, seed) {     // dithered canopy cluster
    for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let xx = Math.floor(cx - r * 1.4); xx <= cx + r * 1.4; xx++) {
      const dx = (xx - cx) / 1.4, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy) + (hash(xx, y + seed) % 3) * 0.5;
      if (d > r) continue;
      let c = cols[1];
      if (dy < -r * 0.35 && dx < r * 0.3) c = cols[0];
      if (dy > r * 0.35 || (dx > r * 0.5 && dy > 0)) c = cols[2];
      if (d > r - 1.5 && (xx + y) % 2) continue;
      if (hash(xx, y + seed * 7) % 23 === 0) c = cols[0];
      x.fillStyle = c; x.fillRect(xx, y, 1, 1);
    }
  }
  function trunk(x, x0, w, y0, y1, cols, seed) {
    for (let y = y0; y < y1; y++) {
      const sway = Math.round(Math.sin(y / 23 + seed) * 1.2);
      for (let i = 0; i < w; i++) {
        let c = i === 0 ? cols[0] : i >= w - 1 ? cols[2] : cols[1];
        if (w > 4 && hash(x0 + i, y + seed) % 13 === 0) c = cols[2];
        x.fillStyle = c; x.fillRect(x0 + i + sway, y, 1, 1);
      }
    }
  }
  function build() {
    const r = cv.getBoundingClientRect();
    PX = r.width < 700 ? 3 : 4;
    W = Math.ceil(r.width / PX); H = Math.ceil(r.height / PX);
    cv.width = W; cv.height = H;
    const pad = 12, LW = W + pad * 2;
    const ground = Math.round(H * 0.8);
    // layer 0: sky
    const L0 = mk(W, H); sky(L0);
    // layer 1: far misty trunks + canopy
    const L1 = mk(LW, H), x1 = L1.getContext('2d');
    for (let i = 0; i < LW; i += 9 + (hash(i, 1) % 7)) trunk(x1, i, 2 + hash(i, 2) % 2, Math.round(H * 0.15), ground, ['#a9d3c6', '#8fbcb0', '#7faea3'], i);
    for (let i = -10; i < LW + 10; i += 14) blob(x1, i + hash(i, 3) % 8, H * 0.08 + hash(i, 4) % Math.round(H * 0.1), 9 + hash(i, 5) % 6, ['#f2cbdc', '#ddb0c6', '#c79ab3'], i);
    // layer 2: mid trunks + blossoms
    const L2 = mk(LW, H), x2 = L2.getContext('2d');
    for (let i = 4; i < LW; i += 22 + (hash(i, 6) % 14)) {
      if (Math.abs(i - pad - W / 2) < W * 0.14) continue;   // keep the middle open for the pillar
      trunk(x2, i, 4 + hash(i, 7) % 3, Math.round(H * 0.12), ground + 2, ['#7b9a90', '#58766f', '#44605c'], i);
    }
    for (let i = -8; i < LW + 8; i += 18) blob(x2, i + hash(i, 8) % 10, H * 0.05 + hash(i, 9) % Math.round(H * 0.13), 11 + hash(i, 10) % 7, ['#ffc6de', '#f095bf', '#c96a98'], i + 50);
    // layer 3: ground, near trunks at the edges, foreground bushes
    const L3 = mk(LW, H), x3 = L3.getContext('2d');
    for (let xx = 0; xx < LW; xx++) {
      const top = ground + Math.round(Math.sin(xx / 17) * 2 + Math.sin(xx / 7) * 1);
      for (let y = top; y < H; y++) {
        let c = y < top + 2 ? '#8dbb5a' : y < top + 6 ? '#6c9b45' : '#4e7a36';
        if ((xx + y) % 2 && y === top + 6) c = '#6c9b45';
        if (hash(xx, y) % 37 === 0) c = ['#ffb3d1', '#ff8fbf', '#ffd6ea'][hash(xx, y) % 3];
        x3.fillStyle = c; x3.fillRect(xx, y, 1, 1);
      }
    }
    const nearW = Math.max(10, Math.round(W * 0.035));
    for (const side of [0, 1]) {
      const x0 = side ? LW - nearW - 6 : 6;
      trunk(x3, x0, nearW, 0, H, ['#4a5a5c', '#2d393c', '#1f282b'], side * 9);
      blob(x3, side ? LW - 10 : 10, H * 0.06, Math.max(16, W * 0.07), ['#ffd6ea', '#ff9ec7', '#d4679a'], side + 3);
      blob(x3, side ? LW - 34 : 34, H * 0.16, Math.max(12, W * 0.05), ['#ffd6ea', '#ff9ec7', '#d4679a'], side + 5);
    }
    for (let i = 0; i < LW; i += 6) {
      const bh = 3 + hash(i, 12) % 6;
      for (let y = H - bh; y < H; y++) for (let k = 0; k < 7; k++) {
        if (hash(i + k, y) % 5 === 0) continue;
        x3.fillStyle = (y === H - bh) ? '#3f6a33' : '#2b4a27'; x3.fillRect(i + k, y, 1, 1);
      }
      if (hash(i, 13) % 3 === 0) { x3.fillStyle = '#ff9ec7'; x3.fillRect(i + 2, H - bh - 1, 1, 1); x3.fillStyle = '#ffd6ea'; x3.fillRect(i + 3, H - bh, 1, 1); }
    }
    layers = [[L0, 0], [L1, 2], [L2, 5], [L3, 10]];
    const n = Math.round(W * H / (PX === 3 ? 260 : 420));
    petals = Array.from({ length: n }, () => newPetal(true));
    motes = Array.from({ length: 24 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.8, p: Math.random() * 6.28 }));
  }
  function newPetal(anywhere) {
    return { x: Math.random() * (W + 40) - 20, y: anywhere ? Math.random() * H : -4 - Math.random() * 20,
      vy: 4 + Math.random() * 7, vx: 2 + Math.random() * 4, p: Math.random() * 6.28, s: Math.random(),
      c: ['#ffb3d1', '#ff8fbf', '#ffd6ea', '#ffc6de'][Math.floor(Math.random() * 4)] };
  }
  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
    for (const [L, par] of layers) {
      const off = par ? Math.round((mx - 0.5) * -par) - 12 : 0;
      g.drawImage(L, off, 0);
    }
    // light shafts
    const rays = [[0.16, 9], [0.33, 14], [0.52, 7], [0.68, 12], [0.84, 9]];
    for (let i = 0; i < rays.length; i++) {
      const [fx, w] = rays[i], a = 0.07 + 0.04 * Math.sin(t / 1400 + i * 1.7);
      g.fillStyle = `rgba(255,246,224,${reduce ? 0.08 : a})`;
      g.beginPath(); const x0 = fx * W - H * 0.35;
      g.moveTo(x0, 0); g.lineTo(x0 + w, 0); g.lineTo(x0 + w + H * 0.55 + w * 2, H * 0.85); g.lineTo(x0 + H * 0.55, H * 0.85); g.closePath(); g.fill();
    }
    // floating motes in the light
    for (const m of motes) {
      const b = (Math.sin(t / 700 + m.p) + 1) / 2; if (b < 0.4) continue;
      g.fillStyle = `rgba(255,243,214,${b * 0.8})`;
      g.fillRect(Math.round(m.x + Math.sin(t / 2000 + m.p) * 4), Math.round(m.y + Math.cos(t / 2600 + m.p) * 3), 1, 1);
    }
    // falling petals
    for (const p of petals) {
      if (!reduce) { p.y += p.vy * dt; p.x += (p.vx + Math.sin(t / 900 + p.p) * 6) * dt; }
      if (p.y > H + 2 || p.x > W + 20) Object.assign(p, newPetal(false));
      const flip = Math.sin(t / 260 + p.p * 3) > 0;
      g.fillStyle = p.c;
      const X = Math.round(p.x), Y = Math.round(p.y);
      if (p.s > 0.6) { g.fillRect(X, Y, flip ? 2 : 1, flip ? 1 : 2); }
      else g.fillRect(X, Y, 1, 1);
    }
    if (!reduce || !frame.once) { frame.once = true; requestAnimationFrame(frame); }
  }
  addEventListener('pointermove', e => { if (e.pointerType === 'mouse') mx = e.clientX / innerWidth; });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); if (reduce) requestAnimationFrame(frame); }, 150); });
  build(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
