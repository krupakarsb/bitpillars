<script>
// SLINGSHOT GARDEN engine: orbit a tiny planet, tap to let go, fly straight, get caught by the next one.
// Every planet you touch blooms. Pure logic, fixed 60 Hz steps, shared by the browser and Node.
(function (root) {
  const WW = 160, WH = 200;              // world size in pixels
  const SPEED = 1.9;                     // flight speed, px per frame
  const RING = 12, INNER = 6;            // capture ring beyond the surface, closest orbit
  const MARGIN = 14;                     // how far past the edge counts as drifting away

  // planets: [x, y, r] or [x, y, r, 'gem']; thorns: [x, y, r]
  const LEVELS = [
    { name: 'First Bloom', hint: 'Tap anywhere to let go. Fly to the next planet.', planets: [[80, 150, 12], [80, 58, 12]], thorns: [] },
    { name: 'Three Seeds', hint: 'Let go when you face where you want to go.', planets: [[44, 160, 11], [116, 112, 11], [50, 52, 11]], thorns: [] },
    { name: 'Small Worlds', hint: 'Small planets spin you faster.', planets: [[80, 168, 14], [128, 108, 6], [36, 96, 7], [96, 38, 10]], thorns: [] },
    { name: 'Thorns', hint: 'Thorns send you back. Fly around them.', planets: [[40, 164, 11], [124, 160, 9], [124, 50, 11], [38, 64, 9]], thorns: [[82, 160, 4], [124, 104, 4], [82, 56, 4], [40, 112, 4]] },
    { name: 'Long Throw', hint: 'Far away, small window. Breathe.', planets: [[30, 172, 9], [134, 24, 9], [130, 170, 7], [30, 30, 7]], thorns: [[80, 100, 6]] },
    { name: 'Ring', hint: 'Bloom the whole ring.', planets: [[80, 176, 9], [138, 124, 8], [124, 46, 8], [36, 46, 8], [22, 124, 8]], thorns: [[80, 100, 7], [70, 92, 3], [92, 110, 3], [92, 90, 3], [68, 112, 3]] },
    { name: 'Detour', hint: 'Some planets only see each other.', planets: [[30, 176, 9], [130, 176, 9], [130, 100, 7], [30, 100, 7], [80, 28, 11]], thorns: [[80, 176, 5], [80, 138, 5], [80, 100, 5], [80, 62, 5], [52, 62, 3], [108, 62, 3]] },
    { name: 'Needle', hint: 'Thread the gap.', planets: [[80, 178, 10], [80, 26, 10], [26, 100, 8], [134, 100, 8]], thorns: [[50, 100, 4], [62, 100, 4], [98, 100, 4], [110, 100, 4], [80, 70, 3], [80, 130, 3]] },
    { name: 'Constellation', hint: 'Every star wants a garden.', planets: [[80, 182, 8], [24, 150, 6], [136, 150, 6], [56, 116, 5], [104, 116, 5], [24, 80, 6], [136, 80, 6], [80, 66, 7], [80, 20, 8]], thorns: [[80, 120, 4], [50, 76, 3], [110, 76, 3], [80, 150, 3]] },
    { name: 'The Gem', hint: 'Bloom the last garden.', finale: true, planets: [[80, 176, 10], [32, 128, 8], [128, 128, 8], [80, 72, 12, 'gem']], thorns: [[80, 128, 4]] },
  ];

  function build(def) {
    const planets = def.planets.map(([x, y, r, kind], i) => ({ i, x, y, r, kind: kind || 'planet', cap: r + RING }));
    const thorns = (def.thorns || []).map(([x, y, r]) => ({ x, y, r }));
    return Object.assign({ hint: '' }, def, { planets, thorns, gem: planets.findIndex(p => p.kind === 'gem') });
  }

  function newState(L) {
    const p = L.planets[0];
    const st = { mode: 'orbit', p: 0, ang: Math.PI * 1.5, dir: 1, d: p.r + 9, x: 0, y: 0, vx: 0, vy: 0, from: -1, clear: false,
      bloom: L.planets.map((q, i) => i === 0), taps: 0, drifts: 0, frame: 0, won: false, letgo: false, last: null, age: 0 };
    place(L, st); st.last = orbitOf(st);
    return st;
  }
  const orbitOf = st => ({ p: st.p, ang: st.ang, dir: st.dir, d: st.d });
  function place(L, st) { const p = L.planets[st.p]; st.x = p.x + Math.cos(st.ang) * st.d; st.y = p.y + Math.sin(st.ang) * st.d; }
  const allBloomed = st => st.bloom.every(Boolean);

  function release(L, st) {
    st.vx = -Math.sin(st.ang) * SPEED * st.dir; st.vy = Math.cos(st.ang) * SPEED * st.dir;
    st.from = st.p; st.clear = false; st.mode = 'fly'; st.taps++; st.age = 0;
  }

  // one 60 Hz frame. tap: true on the frame the player taps.
  function step(L, st, tap) {
    const ev = [];
    if (st.won && !st.letgo) return ev;
    st.frame++;
    if (st.mode === 'orbit') {
      if (tap) {
        const finalGo = L.finale && st.p === L.gem && allBloomed(st);
        release(L, st); ev.push({ type: 'release' });
        if (finalGo) { st.letgo = true; st.won = true; ev.push({ type: 'letgo' }); }
      } else {
        st.ang += st.dir * SPEED / st.d;
        if (st.ang > Math.PI * 2) st.ang -= Math.PI * 2; else if (st.ang < 0) st.ang += Math.PI * 2;
        place(L, st); st.age++;
        return ev;
      }
    }
    // flying in a straight line
    st.x += st.vx; st.y += st.vy; st.age++;
    if (st.letgo) return ev;                              // nothing left to catch
    const from = L.planets[st.from];
    if (!st.clear && Math.hypot(st.x - from.x, st.y - from.y) > from.cap) st.clear = true;
    for (const t of L.thorns) if (Math.hypot(st.x - t.x, st.y - t.y) < t.r + 1.5) { drift(L, st, ev, 'thorn', t); return ev; }
    let best = -1, bd = 1e9;
    for (const p of L.planets) {
      if (p.i === st.from && !st.clear) continue;
      const dd = Math.hypot(st.x - p.x, st.y - p.y);
      if (dd <= p.cap && dd < bd) { bd = dd; best = p.i; }
    }
    if (best >= 0) {
      const p = L.planets[best], rx = st.x - p.x, ry = st.y - p.y;
      st.p = best; st.d = Math.max(p.r + INNER, Math.min(p.cap, bd)); st.ang = Math.atan2(ry, rx); if (st.ang < 0) st.ang += Math.PI * 2;
      st.dir = rx * st.vy - ry * st.vx >= 0 ? 1 : -1; st.mode = 'orbit'; st.age = 0;
      place(L, st);
      const fresh = !st.bloom[best]; st.bloom[best] = true; st.last = orbitOf(st);
      ev.push({ type: 'catch', p: best, fresh });
      if (!L.finale && allBloomed(st)) { st.won = true; ev.push({ type: 'win' }); }
      if (L.finale && best === L.gem && allBloomed(st)) ev.push({ type: 'gemready' });
      return ev;
    }
    if (st.x < -MARGIN || st.y < -MARGIN || st.x > WW + MARGIN || st.y > WH + MARGIN) drift(L, st, ev, 'away');
    return ev;
  }
  function drift(L, st, ev, cause, t) {
    st.drifts++;
    ev.push({ type: 'drift', cause, x: st.x, y: st.y, t });
    Object.assign(st, st.last); st.mode = 'orbit'; st.age = 0; place(L, st);
    ev.push({ type: 'respawn' });
  }

  const snapshot = st => ({ mode: st.mode, p: st.p, ang: st.ang, dir: st.dir, d: st.d, x: st.x, y: st.y, vx: st.vx, vy: st.vy, from: st.from, clear: st.clear,
    bloom: st.bloom.slice(), taps: st.taps, drifts: st.drifts, frame: st.frame, won: st.won, letgo: st.letgo, last: Object.assign({}, st.last), age: st.age });
  const restore = (st, s) => { Object.assign(st, s, { bloom: s.bloom.slice(), last: Object.assign({}, s.last) }); };

  const api = { WW, WH, SPEED, RING, LEVELS, build, newState, step, snapshot, restore, allBloomed };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.SG = api;
})(this);

</script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const { WW, WH, LEVELS } = SG;

// ---------------- save ----------------
const SK = 'slingshot-garden-v1';
let save = { cleared: -1, best: {}, finished: false, time: 0, sfx: true, music: true };
try { const s = JSON.parse(localStorage.getItem(SK)); if (s) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(SK, JSON.stringify(save)); } catch (e) {} };

// ---------------- audio ----------------
let AC = null, master, sfxG, musG, noiseBuf, musTimer = null, musNext = 0, musStep = 0;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    sfxG = AC.createGain(); sfxG.gain.value = save.sfx ? 1 : 0; sfxG.connect(master);
    musG = AC.createGain(); musG.gain.value = save.music ? 0.2 : 0; musG.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, slide, when, dest) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxG); s.start(t); s.stop(t + dur + 0.02);
}
const PENTA = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319];
const SFX = {
  release() { noise(0.18, 0.06, 2400); tone(520, 0.12, 'triangle', 0.04, 780); },
  catch(n) { const f = PENTA[Math.min(n, PENTA.length - 1)]; tone(f, 0.5, 'triangle', 0.07); tone(f * 2, 0.35, 'sine', 0.03, null, 0.06); },
  bloom(n) { const f = PENTA[Math.min(n, PENTA.length - 1)]; [1, 1.25, 1.5, 2].forEach((m, i) => tone(f * m, 0.6, 'sine', 0.05, null, i * 0.06)); },
  drift() { tone(660, 0.6, 'sine', 0.06, 220); },
  thorn() { noise(0.15, 0.14, 3000); tone(300, 0.2, 'square', 0.04, 120); },
  win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.7, 'triangle', 0.06, null, i * 0.09)); },
  letgo() { [392, 523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 1.6, 'sine', 0.05, null, i * 0.22)); tone(98, 4, 'sine', 0.16, 196, 0.2); },
  click() { tone(880, 0.04, 'square', 0.03); },
};
function startMusic() {
  if (!AC || musTimer) return;
  musNext = AC.currentTime + 0.1;
  const chords = [[261.6, 329.6, 392, 493.9], [220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [196, 246.9, 293.7, 392]];  // Cmaj7 Am7 Fmaj7 G
  musTimer = setInterval(() => {
    if (!AC) return;
    while (musNext < AC.currentTime + 0.3) {
      const t = musNext - AC.currentTime, bar = Math.floor(musStep / 8) % 4, beat = musStep % 8, ch = chords[bar];
      if (beat === 0) { tone(ch[0] / 2, 2.6, 'sine', 0.22, null, t, musG); tone(ch[2], 2.4, 'sine', 0.05, null, t, musG); }
      if (Math.random() < (beat % 2 ? 0.25 : 0.55)) tone(ch[Math.floor(Math.random() * 4)] * 2, 0.9, 'triangle', 0.035, null, t, musG);
      musNext += 60 / 76 / 2; musStep++;
    }
  }, 80);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.mode === 'play' && !G.st.won) openPause(); if (AC) AC.suspend().catch(() => {}); } else if (AC) AC.resume().catch(() => {}); });

// ---------------- canvas ----------------
const cv = $('c'), ctx = cv.getContext('2d');
const lo = document.createElement('canvas'), g = lo.getContext('2d');
const world = document.createElement('canvas'); world.width = WW; world.height = WH; const wg = world.getContext('2d');
let S = 3, DPR = 1, ox = 0, oy = 0, stars = [];
const G = { mode: 'title', idx: 0, L: null, st: null, acc: 0, prev: null, time: 0, particles: [], trail: [], flowers: [], grow: [],
  shake: 0, flash: 0, flashCol: '#fff', wonAt: 0, tap: false, gemAt: 0, gemStage: 0, letAt: 0, zoom: 1, star: null };

function fit() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const Wc = innerWidth, Hc = innerHeight;
  cv.width = Math.round(Wc * DPR); cv.height = Math.round(Hc * DPR);

    const b = document.createElement('button'), locked = i > save.cleared + 1, best = save.best[i];
    b.innerHTML = `<span class="n">${locked ? '·' : i + 1}</span><span class="t">${locked ? '' : best !== undefined ? best + ' TAPS' : d.name.toUpperCase()}</span>`;
    if (i <= save.cleared) b.classList.add('done');
    if (locked) b.disabled = true; else b.onclick = () => { SFX.click(); startGarden(i); };
    gr.appendChild(b);
  });
}
function openPause() { if (G.mode !== 'play' || G.st.letgo) return; G.mode = 'pause'; refreshTitle(); show('pause'); }
function resume() { G.mode = 'play'; show(null); last = performance.now(); }
function gardenDone() {
  const i = G.idx, st = G.st;
  save.cleared = Math.max(save.cleared, i); save.time += G.time;
  if (save.best[i] === undefined || st.taps < save.best[i]) save.best[i] = st.taps; persist();
  $('cInfo').innerHTML = `${LEVELS[i].name.toUpperCase()}<br>TAPS ${st.taps} · BEST ${save.best[i]}<br>${st.drifts ? 'DRIFTS ' + st.drifts : 'NO DRIFTS'} · TIME ${fmt(G.time)}`;
  $('cNext').textContent = i === LEVELS.length - 2 ? 'THE LAST GARDEN' : 'NEXT';
  G.mode = 'clear'; show('clear');
}
function finish() {
  const i = G.idx, st = G.st;
  save.cleared = Math.max(save.cleared, i); save.finished = true; save.time += G.time;
  if (save.best[i] === undefined || st.taps < save.best[i]) save.best[i] = st.taps; persist();
  $('eInfo').innerHTML = `Ten gardens in bloom, and one new star.<br>Some things you catch. Some you let go.<br><br>TOTAL TIME ${fmt(save.time)}`;
  G.mode = 'ending'; show('ending'); setTimeout(() => $('ending').classList.add('on'), 50);
}

const tapBtn = (id, fn) => $(id).addEventListener('click', e => { audio(); SFX.click(); fn(e); });
tapBtn('tPlay', () => startGarden(save.finished ? 0 : Math.min(save.cleared + 1, LEVELS.length - 1)));
tapBtn('tLevels', () => { buildGrid(); show('levels'); });
tapBtn('tSfx', () => { save.sfx = !save.sfx; if (sfxG) sfxG.gain.value = save.sfx ? 1 : 0; persist(); refreshTitle(); });
tapBtn('tMusic', () => { save.music = !save.music; if (musG) musG.gain.value = save.music ? 0.2 : 0; persist(); refreshTitle(); });
tapBtn('pSfx', () => $('tSfx').click());
tapBtn('pMusic', () => $('tMusic').click());
tapBtn('lBack', () => { G.mode = 'title'; G.L = null; show('title'); });
tapBtn('bMenu', openPause);
tapBtn('bReset', () => { if (!G.st.letgo) startGarden(G.idx); });
tapBtn('pResume', resume);
tapBtn('pReset', () => startGarden(G.idx));
tapBtn('pLevels', () => { G.mode = 'title'; G.L = null; buildGrid(); show('levels'); });
tapBtn('pTitle', () => { G.mode = 'title'; G.L = null; show('title'); });
tapBtn('cRetry', () => startGarden(G.idx));
tapBtn('cNext', () => startGarden(Math.min(G.idx + 1, LEVELS.length - 1)));
tapBtn('eLevels', () => { $('ending').classList.remove('on'); G.mode = 'title'; G.L = null; buildGrid(); show('levels'); });
tapBtn('eTitle', () => { $('ending').classList.remove('on'); G.mode = 'title'; G.L = null; show('title'); });
tapBtn('eBP', () => { location.href = '../index.html'; });

fit(); show('title'); requestAnimationFrame(frame);
window.__G = G; window.__SG = SG; window.__view = () => ({ S, DPR, ox, oy });
})();
</script>
