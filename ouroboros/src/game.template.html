<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OUROBOROS · a BitPillars game</title>
<meta name="description" content="OUROBOROS: a snake in a world without edges. A small pixel game by BitPillars.">
<meta name="theme-color" content="#05060f">
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../brand/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffcf5a; --gold-dk:#c97a18; --teal:#7ff3e0; --pink:#ff7ab8; --cream:#f4efe6; --ink:#0b0a1f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#05060f; color:var(--cream); font-family:'Silkscreen',monospace;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; image-rendering:pixelated; display:block; }
  .hidden { display:none !important; }
  button { font-family:'Silkscreen',monospace; font-size:15px; font-weight:700; color:var(--cream); background:rgba(11,10,31,.7);
    border:0; padding:12px 16px; cursor:pointer; letter-spacing:1px; box-shadow:inset 0 0 0 2px rgba(255,207,90,.6), 0 4px 0 rgba(0,0,0,.4);
    touch-action:manipulation; }
  button:active { transform:translateY(3px); box-shadow:inset 0 0 0 2px rgba(255,207,90,.6), 0 1px 0 rgba(0,0,0,.4); }
  button.big { background:var(--gold); color:var(--ink); font-size:18px; padding:15px 22px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.45), 0 5px 0 var(--gold-dk), 0 0 26px rgba(255,207,90,.4); }
  button:disabled { opacity:.45; cursor:default; }
  .jersey { font-family:'Jersey 10','Silkscreen',monospace; font-weight:400; }

  /* HUD */
  .hud { position:fixed; z-index:3; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 0; pointer-events:none; }
  #hName { font-size:30px; letter-spacing:2px; line-height:1; text-shadow:3px 3px 0 rgba(0,0,0,.6); }
  #hNum { font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:4px; }
  .hr { text-align:right; }
  #hBits { font-size:28px; line-height:1; text-shadow:3px 3px 0 rgba(0,0,0,.6); }
  #hBits b { color:var(--teal); font-weight:400; }
  #hSub { font-size:11px; opacity:.7; margin-top:6px; letter-spacing:1px; }
  #cap { position:fixed; z-index:3; left:16px; right:16px; text-align:center; font-size:13px; line-height:1.6; color:#fff3d6;
    text-shadow:2px 2px 0 rgba(0,0,0,.7); pointer-events:none; transition:opacity .5s; }
  #start { position:fixed; z-index:3; left:0; right:0; text-align:center; font-size:14px; letter-spacing:3px; color:var(--gold);
    text-shadow:2px 2px 0 rgba(0,0,0,.7); pointer-events:none; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .ctrl { position:fixed; z-index:3; bottom:calc(env(safe-area-inset-bottom) + 14px); left:16px; right:16px; display:flex; justify-content:space-between; pointer-events:none; }
  .ctrl button { pointer-events:auto; font-size:12px; padding:10px 12px; }

  /* screens */
  .screen { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px); text-align:center; }
  .dim { background:rgba(4,5,14,.72); backdrop-filter:blur(2px); }
  #emblem { width:min(170px,32vh); height:min(170px,32vh); flex:none; margin-bottom:-4px; }
  #title h1 { margin:0; font-size:clamp(64px,13vw,128px); letter-spacing:6px; line-height:.9; color:var(--cream);
    text-shadow:5px 5px 0 #2c8f8a, 10px 10px 0 rgba(0,0,0,.5), 0 0 40px rgba(127,243,224,.25); }
  .tag { font-size:13px; color:#cfd8ff; letter-spacing:2px; margin:0 0 18px; opacity:.85; }
  .menu { display:flex; flex-direction:column; gap:12px; width:min(300px,86vw); }
  .row { display:flex; gap:10px; } .row button { flex:1; }
  .small { font-size:11px; opacity:.7; }
  .by { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 14px); left:0; right:0; font-size:11px; opacity:.75; }
  .by a { color:var(--gold); text-decoration:none; }
  .card { background:rgba(11,10,31,.92); padding:26px 24px; width:min(340px,88vw); box-shadow:inset 0 0 0 3px var(--gold), 0 10px 0 rgba(0,0,0,.4);
    display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  .card h2 { margin:0; font-size:44px; letter-spacing:3px; color:var(--gold); line-height:1; }
  .card p { margin:0; font-size:13px; line-height:1.7; color:#e8e4f8; }
  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(330px,88vw); }
  #grid button { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:6px; }
  #grid button .n { font-family:'Jersey 10',monospace; font-size:34px; line-height:1; }
  #grid button .t { font-size:9px; opacity:.8; }
  #grid button.done { box-shadow:inset 0 0 0 2px var(--teal), 0 4px 0 rgba(0,0,0,.4); }
  #ending { background:radial-gradient(circle at 50% 42%, rgba(255,207,90,.16), rgba(4,5,14,.94) 62%); }
  #ending h2 { font-size:clamp(40px,8vw,72px); letter-spacing:4px; margin:0; color:var(--gold); line-height:1; text-shadow:4px 4px 0 rgba(0,0,0,.5); }
  #ending p { font-size:13px; line-height:1.8; max-width:420px; margin:0; color:#e8e4f8; }
  #toast { position:fixed; z-index:6; left:50%; top:40%; transform:translate(-50%,-50%); font-size:30px; letter-spacing:2px; color:var(--pink);
    text-shadow:3px 3px 0 rgba(0,0,0,.7); pointer-events:none; opacity:0; transition:opacity .2s; white-space:nowrap; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud hidden" id="hud">
  <div><div id="hNum">LEVEL 1</div><div id="hName" class="jersey">FIRST LIGHT</div></div>
  <div class="hr"><div id="hBits" class="jersey"><b>0</b>/5</div><div id="hSub">LENGTH 3</div></div>
</div>
<div id="cap"></div>
<div id="start" class="hidden">SWIPE TO START</div>
<div class="ctrl hidden" id="ctrl"><button id="bMenu">MENU</button><button id="bRestart">RESTART</button></div>
<div id="toast" class="jersey"></div>

<div class="screen" id="title">
  <div id="emblem"></div>
  <h1 class="jersey">OUROBOROS</h1>
  <p class="tag">a snake in a world without edges</p>
  <div class="menu">
    <button class="big" id="tPlay">PLAY</button>
    <div class="row"><button id="tLevels">LEVELS</button><button id="tEndless">ENDLESS</button></div>
    <div class="row"><button id="tSfx">SFX ON</button><button id="tMusic">MUSIC ON</button></div>
    <div class="small" id="tStats"></div>
  </div>
  <div class="by">a <a href="../index.html">BitPillars</a> game</div>
</div>

<div class="screen dim hidden" id="levels">
  <h2 class="jersey" style="margin:0;font-size:44px;letter-spacing:3px;color:var(--gold)">LEVELS</h2>
  <div id="grid"></div>
  <button id="lBack">BACK</button>
</div>

<div class="screen dim hidden" id="pause">
  <div class="card">
    <h2 class="jersey">PAUSED</h2>
    <button class="big" id="pResume">RESUME</button>
    <div class="row"><button id="pRestart">RESTART</button><button id="pLevels">LEVELS</button></div>
    <div class="row"><button id="pSfx">SFX</button><button id="pMusic">MUSIC</button></div>
    <button id="pTitle">TITLE</button>
  </div>
</div>

<div class="screen dim hidden" id="clear">
  <div class="card">
    <h2 class="jersey" id="cTitle">CLEAR</h2>
    <p id="cInfo"></p>
    <div class="row"><button id="cRetry">RETRY</button><button class="big" id="cNext">NEXT</button></div>
  </div>
</div>

<div class="screen hidden" id="ending">
  <h2 class="jersey">THE END WAS<br>THE BEGINNING</h2>
  <p id="eInfo"></p>
  <div class="menu" style="margin-top:10px">
    <button class="big" id="eEndless">ENDLESS MODE</button>
    <div class="row"><button id="eTitle">TITLE</button><button id="eBP">BITPILLARS</button></div>
  </div>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const { W, H, DIRS, LEVELS } = OB;
const CELL = 8, AW = W * CELL, AH = H * CELL;

// ---------------- save ----------------
const SK = 'ouroboros-v1';
let save = { cleared: -1, best: {}, finished: false, endlessBest: 0, deaths: 0, time: 0, sfx: true, music: true };
try { const s = JSON.parse(localStorage.getItem(SK)); if (s) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(SK, JSON.stringify(save)); } catch (e) {} };

// ---------------- audio ----------------
let AC = null, master, sfxG, musG, noiseBuf, musTimer = null, musNext = 0, musStep = 0, mood = 'calm';
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    sfxG = AC.createGain(); sfxG.gain.value = save.sfx ? 1 : 0; sfxG.connect(master);
    musG = AC.createGain(); musG.gain.value = save.music ? 0.18 : 0; musG.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, slide, when, dest) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxG); s.start(t); s.stop(t + dur + 0.02);
}
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const SFX = {
  eat(n) { const f = PENTA[Math.min(n, PENTA.length - 1)]; tone(f, 0.16, 'square', 0.07); tone(f * 1.5, 0.12, 'triangle', 0.05, null, 0.04); },
  gold() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.18, 'triangle', 0.08, null, i * 0.04)); },
  pink() { tone(660, 0.22, 'triangle', 0.09, 330); },
  turn() { tone(220, 0.03, 'triangle', 0.025); },
  wrap() { tone(1200, 0.06, 'sine', 0.03, 1800); },
  die() { noise(0.4, 0.28, 700); tone(180, 0.35, 'sawtooth', 0.06, 50); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => { tone(f, 0.26, 'square', 0.05, null, i * 0.07); tone(f / 2, 0.3, 'triangle', 0.07, null, i * 0.07); }); },
  grow() { tone(70, 0.22, 'sine', 0.22, 45); },
  closed() { [392, 494, 587, 784, 988, 1175, 1568].forEach((f, i) => { tone(f, 0.6, 'triangle', 0.08, null, i * 0.11); }); tone(98, 2.4, 'sine', 0.2, 196); },
  click() { tone(880, 0.04, 'square', 0.04); },
};
function startMusic() {
  if (!AC || musTimer) return;
  musNext = AC.currentTime + 0.1;
  const scale = [293.7, 329.6, 349.2, 392, 440, 523.3, 587.3];        // D dorian, soft
  const roots = [146.8, 130.8, 174.6, 164.8];
  musTimer = setInterval(() => {
    if (!AC) return;
    while (musNext < AC.currentTime + 0.25) {
      const t = musNext - AC.currentTime, bar = Math.floor(musStep / 8) % 4, beat = musStep % 8;
      if (mood === 'finale') {
        if (beat === 0) tone(roots[bar] / 2, 1.6, 'sine', 0.3, null, t, musG);
        if (beat === 4 && Math.random() < 0.6) tone(scale[Math.floor(Math.random() * 3)] * 2, 0.9, 'sine', 0.05, null, t, musG);
      } else {
        if (beat === 0 || beat === 4) tone(roots[bar], 0.5, 'triangle', 0.28, null, t, musG);
        if (Math.random() < (beat % 2 ? 0.3 : 0.62)) tone(scale[Math.floor(Math.random() * scale.length)] * (Math.random() < 0.3 ? 2 : 1), 0.24, beat % 2 ? 'triangle' : 'square', 0.05, null, t, musG);
      }
      musNext += 60 / 92 / 2; musStep++;
    }
  }, 60);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.mode === 'play' && G.st && G.st.started && G.st.alive && !G.st.won) openPause(); if (AC) AC.suspend().catch(() => {}); } else if (AC) AC.resume().catch(() => {}); });

// ---------------- canvas ----------------
const cv = $('c'), ctx = cv.getContext('2d');
const lo = document.createElement('canvas'), g = lo.getContext('2d');
const arena = document.createElement('canvas'), ag = arena.getContext('2d');
let S = 4, DPR = 1, ox = 0, oy = 0, stars = [];

const G = { mode: 'title', kind: 'story', idx: 0, L: null, st: null, acc: 0, deaths: 0, lvlTime: 0, combo: 0, lastEat: -9,
  particles: [], shake: 0, flash: 0, flashCol: '#fff', dieAt: 0, clearAt: 0, closedAt: 0, glowFrom: -1, finaleT: 0, hintStage: 0, demoT: 0 };

function fit() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const Wc = innerWidth, Hc = innerHeight;
  cv.width = Math.round(Wc * DPR); cv.height = Math.round(Hc * DPR);
  const top = 96, bottom = 120;
  const availW = Wc * 0.92, availH = Math.max(160, Hc - top - bottom);
  S = Math.max(2, Math.floor(Math.min(availW * DPR / AW, availH * DPR / AH)));
  lo.width = Math.ceil(cv.width / S); lo.height = Math.ceil(cv.height / S);
  ox = Math.floor((lo.width - AW) / 2);
  oy = Math.floor(((top + availH / 2) * DPR) / S - AH / 2);
  const capY = (oy + AH) * S / DPR + 14;
  $('cap').style.top = capY + 'px'; $('start').style.top = (oy * S / DPR - 26) + 'px';
  stars = Array.from({ length: Math.round(lo.width * lo.height / 700) }, () => ({ x: Math.random() * lo.width, y: Math.random() * lo.height,
    c: ['#cfd8ff', '#7ff3e0', '#ffcf5a', '#ff9ec7', '#ffffff'][Math.floor(Math.random() * 5)], p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.2, b: 0.15 + Math.random() * 0.6 }));
  if (G.L) buildArena();
}
addEventListener('resize', fit);

function hsh(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; }
function buildArena() {
  arena.width = AW; arena.height = AH; ag.clearRect(0, 0, AW, AH);
  ag.fillStyle = 'rgba(255,255,255,0.03)'; ag.fillRect(0, 0, AW, AH);
  const L = G.L;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const w = L.walls[y * W + x], px = x * CELL, py = y * CELL;
    if (!w) { ag.fillStyle = 'rgba(207,216,255,0.10)'; ag.fillRect(px + 3, py + 3, 1, 1); continue; }
    if (w === 2) continue;                                   // the gem is drawn live
    const up = y > 0 && L.walls[(y - 1) * W + x] === 1, dn = y < H - 1 && L.walls[(y + 1) * W + x] === 1;
    const lf = x > 0 && L.walls[y * W + x - 1] === 1, rt = x < W - 1 && L.walls[y * W + x + 1] === 1;
    ag.fillStyle = '#3e414d'; ag.fillRect(px, py, CELL, CELL);
    ag.fillStyle = '#6a6e7c'; if (!up) ag.fillRect(px, py, CELL, 1); if (!lf) ag.fillRect(px, py, 1, CELL);
    ag.fillStyle = '#24262e'; if (!dn) ag.fillRect(px, py + CELL - 1, CELL, 1); if (!rt) ag.fillRect(px + CELL - 1, py, 1, CELL);
    const h = hsh(x, y);
    ag.fillStyle = '#2c2e37'; ag.fillRect(px + 2 + h % 4, py + 2 + (h >> 4) % 4, 1, 1);
    if (h % 7 === 0) { ag.fillStyle = '#ffcf5a'; ag.fillRect(px + 3 + (h >> 6) % 2, py + 3 + (h >> 8) % 2, 1, 1); }
  }
}

// ---------------- levels ----------------
function startLevel(idx, kind) {
  G.kind = kind || 'story'; G.idx = idx;
  G.L = G.kind === 'endless' ? OB.endlessLevel((Math.random() * 1e9) | 0) : OB.buildLevel(LEVELS[idx]);
  G.st = OB.newState(G.L, (Math.random() * 1e9) | 0);
  G.acc = 0; G.lvlTime = 0; G.combo = 0; G.particles = []; G.glowFrom = -1; G.finaleT = 0; G.hintStage = 0;
  G.mode = 'play'; mood = G.L.finale ? 'finale' : 'calm';
  buildArena(); show(null); updateHud();
  $('cap').textContent = G.L.hint; $('cap').style.opacity = 1;
  $('start').textContent = matchMedia('(pointer:coarse)').matches ? 'SWIPE TO START' : 'PRESS AN ARROW TO START';
  $('start').classList.remove('hidden');
  if (G.kind === 'story' && idx === LEVELS.length - 1 && G.deaths >= 2) $('cap').textContent = 'Close the loop.';
}
function restartLevel() { const d = G.deaths; startLevel(G.idx, G.kind); G.deaths = d; }
function updateHud() {
  const L = G.L, st = G.st;
  if (G.kind === 'endless') { $('hNum').textContent = 'ENDLESS · BEST ' + save.endlessBest; $('hName').textContent = 'ENDLESS'; $('hBits').innerHTML = '<b>' + st.eaten + '</b>'; }
  else {
    $('hNum').textContent = 'LEVEL ' + (G.idx + 1) + ' / ' + LEVELS.length;
    $('hName').textContent = L.name.toUpperCase();
    $('hBits').innerHTML = L.finale ? '<b>?</b>' : '<b>' + st.eaten + '</b>/' + L.goal;
  }
  $('hSub').textContent = 'LENGTH ' + st.snake.length + (G.deaths ? ' · TRIES ' + (G.deaths + 1) : '');
}

// ---------------- input ----------------
function steer(d) {
  if (G.mode !== 'play' || !G.st || !G.st.alive || G.st.won) return;
  audio();
  const was = G.st.started;
  if (OB.turn(G.st, d)) SFX.turn();
  if (!was) { G.st.started = true; $('start').classList.add('hidden'); }
}
const KEYS = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in KEYS) { e.preventDefault(); if (G.mode === 'play') { if (!G.st.started) { G.st.started = true; $('start').classList.add('hidden'); OB.turn(G.st, KEYS[k]); } else steer(KEYS[k]); } }
  else if (k === 'escape' || k === 'p') { if (G.mode === 'play') openPause(); else if (G.mode === 'pause') resume(); }
  else if (k === 'r' && G.mode === 'play') restartLevel();
  else if ((k === 'enter' || k === ' ') && G.mode === 'clear') $('cNext').click();
});
let sw = null;
cv.addEventListener('pointerdown', e => { audio(); sw = { x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => {
  if (!sw || G.mode !== 'play') return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.hypot(dx, dy) > 18) {
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    if (!G.st.started) { G.st.started = true; $('start').classList.add('hidden'); OB.turn(G.st, d); } else steer(d);
    sw = { x: e.clientX, y: e.clientY };                     // keep swiping without lifting the finger
  }
});
addEventListener('pointerup', () => sw = null);
addEventListener('pointercancel', () => sw = null);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---------------- game loop ----------------
function burst(x, y, n, cols, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (0.3 + Math.random()) * spd;
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.5 + Math.random() * 0.7), max: life, c: cols[i % cols.length] });
  }
}
function onEvents(ev) {
  const st = G.st, L = G.L, h = st.snake[0];
  for (const e of ev) {
    if (e.type === 'eat') {
      const now = G.lvlTime; G.combo = now - G.lastEat < 2.2 ? G.combo + 1 : 0; G.lastEat = now;
      const cx = e.bit.x * CELL + 4, cy = e.bit.y * CELL + 4;
      if (e.bit.type === 'gold') { SFX.gold(); burst(cx, cy, 26, ['#ffcf5a', '#fff4c9', '#e09a2b'], 0.09, 650); G.flash = 1; G.flashCol = '#ffcf5a'; }
      else if (e.bit.type === 'pink') { SFX.pink(); burst(cx, cy, 18, ['#ff7ab8', '#ffd6ea'], 0.07, 550); }

function finaleHints() {

// ---------------- render ----------------
const RA = [1, 0.26, 0.11, 0.05];
function lerpPos(p, c, t) {

function render(now, dt) {

  g.globalAlpha = 1; g.fillStyle = '#05060f'; g.fillRect(0, 0, Wl, Hl);

// title screen: an ouroboros circling the gem
