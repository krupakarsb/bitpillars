<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ECHO · a BitPillars game</title>
<meta name="description" content="ECHO: ten-second rooms. Every life you lose leaves a frozen echo you can stand on. A small pixel game by BitPillars.">
<meta name="theme-color" content="#06050f">
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../brand/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffcf5a; --gold-dk:#c97a18; --cyan:#8ff0ff; --pink:#ff7ab8; --cream:#f4efe6; --ink:#0b0a1f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#06050f; color:var(--cream); font-family:'Silkscreen',monospace;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; image-rendering:pixelated; display:block; }
  .hidden { display:none !important; }
  button { font-family:'Silkscreen',monospace; font-size:15px; font-weight:700; color:var(--cream); background:rgba(11,10,31,.7);
    border:0; padding:12px 16px; cursor:pointer; letter-spacing:1px; box-shadow:inset 0 0 0 2px rgba(143,240,255,.55), 0 4px 0 rgba(0,0,0,.4);
    touch-action:manipulation; }
  button:active { transform:translateY(3px); box-shadow:inset 0 0 0 2px rgba(143,240,255,.55), 0 1px 0 rgba(0,0,0,.4); }
  button.big { background:var(--gold); color:var(--ink); font-size:18px; padding:15px 22px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.45), 0 5px 0 var(--gold-dk), 0 0 26px rgba(255,207,90,.4); }
  button:disabled { opacity:.45; cursor:default; }
  .jersey { font-family:'Jersey 10','Silkscreen',monospace; font-weight:400; }

  .hud { position:fixed; z-index:3; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 0; pointer-events:none; }
  #hNum { font-size:12px; color:var(--cyan); letter-spacing:2px; margin-bottom:4px; }
  #hName { font-size:30px; letter-spacing:2px; line-height:1; text-shadow:3px 3px 0 rgba(0,0,0,.6); }
  .hr { text-align:right; }
  #hEcho { font-size:28px; line-height:1; text-shadow:3px 3px 0 rgba(0,0,0,.6); }
  #hEcho b { color:var(--cyan); font-weight:400; }
  #hSub { font-size:11px; opacity:.7; margin-top:6px; letter-spacing:1px; }
  #cap { position:fixed; z-index:3; left:16px; right:16px; text-align:center; font-size:13px; line-height:1.6; color:#fff3d6;
    text-shadow:2px 2px 0 rgba(0,0,0,.7); pointer-events:none; transition:opacity .5s; }
  .ctrl { position:fixed; z-index:3; top:calc(env(safe-area-inset-top) + 64px); left:16px; right:16px; display:flex; justify-content:space-between; pointer-events:none; }
  .ctrl button { pointer-events:auto; font-size:11px; padding:8px 10px; }
  #pad { position:fixed; z-index:4; left:0; right:0; bottom:0; height:calc(env(safe-area-inset-bottom) + 132px); display:flex; justify-content:space-between;
    align-items:center; padding:0 14px env(safe-area-inset-bottom); pointer-events:none; }
  #pad .grp { display:flex; gap:12px; pointer-events:auto; }
  #pad button { width:72px; height:72px; padding:0; font-size:12px; border-radius:50%; background:rgba(20,18,46,.72);
    box-shadow:inset 0 0 0 2px rgba(143,240,255,.5), 0 4px 0 rgba(0,0,0,.4); display:grid; place-items:center; }
  #pad button.on { background:rgba(143,240,255,.25); transform:translateY(2px); }
  #pad #kJump { background:rgba(255,207,90,.22); box-shadow:inset 0 0 0 2px rgba(255,207,90,.75), 0 4px 0 rgba(0,0,0,.4); }
  #pad #kJump.on { background:rgba(255,207,90,.5); }
  #pad svg { width:26px; height:26px; image-rendering:pixelated; }

  .screen { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px); text-align:center; }
  .dim { background:rgba(4,4,14,.74); backdrop-filter:blur(2px); }
  #emblem { width:min(150px,26vh); height:min(110px,19vh); flex:none; }
  #title h1 { margin:0; font-size:clamp(76px,15vw,150px); letter-spacing:10px; line-height:.85; color:var(--cream); position:relative;
    text-shadow:6px 0 0 rgba(143,240,255,.35), 12px 0 0 rgba(143,240,255,.15), 5px 6px 0 rgba(0,0,0,.5); }
  .tag { font-size:13px; color:#cfd8ff; letter-spacing:2px; margin:0 0 18px; opacity:.85; }
  .menu { display:flex; flex-direction:column; gap:12px; width:min(300px,86vw); }
  .row { display:flex; gap:10px; } .row button { flex:1; }
  .small { font-size:11px; opacity:.7; }
  .by { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 14px); left:0; right:0; font-size:11px; opacity:.75; }
  .by a { color:var(--gold); text-decoration:none; }
  .card { background:rgba(11,10,31,.92); padding:26px 24px; width:min(340px,88vw); box-shadow:inset 0 0 0 3px var(--cyan), 0 10px 0 rgba(0,0,0,.4);
    display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  .card h2 { margin:0; font-size:44px; letter-spacing:3px; color:var(--cyan); line-height:1; }
  .card p { margin:0; font-size:13px; line-height:1.7; color:#e8e4f8; }
  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; width:min(420px,90vw); }
  #grid button { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:4px; }
  #grid button .n { font-family:'Jersey 10',monospace; font-size:32px; line-height:1; }
  #grid button .t { font-size:8px; opacity:.8; }
  #grid button.done { box-shadow:inset 0 0 0 2px var(--gold), 0 4px 0 rgba(0,0,0,.4); }
  #ending { justify-content:flex-start; padding-top:calc(env(safe-area-inset-top) + 9vh); pointer-events:none; }
  #ending > * { pointer-events:auto; }
  #ending h2 { font-size:clamp(46px,9vw,84px); letter-spacing:6px; margin:0; color:var(--cream); line-height:.9;
    text-shadow:6px 0 0 rgba(143,240,255,.35), 5px 6px 0 rgba(0,0,0,.5); }
  #ending p { font-size:13px; line-height:1.8; max-width:440px; margin:0; color:#e8e4f8; text-shadow:2px 2px 0 rgba(0,0,0,.7); }
  #ending .menu { margin-top:6px; }
  #toast { position:fixed; z-index:6; left:50%; top:34%; transform:translate(-50%,-50%); font-size:28px; letter-spacing:2px; color:var(--cyan);
    text-shadow:3px 3px 0 rgba(0,0,0,.7); pointer-events:none; opacity:0; transition:opacity .2s; white-space:nowrap; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud hidden" id="hud">
  <div><div id="hNum">ROOM 1</div><div id="hName" class="jersey">FIRST STEPS</div></div>
  <div class="hr"><div id="hEcho" class="jersey"><b>0</b>/3</div><div id="hSub">ECHOES</div></div>
</div>
<div class="ctrl hidden" id="ctrl"><button id="bMenu">MENU</button><button id="bReset">RESET ROOM</button></div>
<div id="cap"></div>
<div id="pad" class="hidden">
  <div class="grp">
    <button id="kL" aria-label="Left"><svg viewBox="0 0 9 9"><path fill="#f4efe6" d="M2 4h1V3h1V2h1V1h1v7H5V7H4V6H3V5H2z"/></svg></button>
    <button id="kR" aria-label="Right"><svg viewBox="0 0 9 9"><path fill="#f4efe6" d="M7 4H6V3H5V2H4V1H3v7h1V7h1V6h1V5h1z"/></svg></button>
  </div>
  <div class="grp">
    <button id="kE" aria-label="Echo">ECHO</button>
    <button id="kJump" aria-label="Jump">JUMP</button>
  </div>
</div>
<div id="toast" class="jersey"></div>

<div class="screen" id="title">
  <div id="emblem"></div>
  <h1 class="jersey">ECHO</h1>
  <p class="tag">ten-second rooms · every life you lose stays behind</p>
  <div class="menu">
    <button class="big" id="tPlay">PLAY</button>
    <button id="tLevels">ROOMS</button>
    <div class="row"><button id="tSfx">SFX ON</button><button id="tMusic">MUSIC ON</button></div>
    <div class="small" id="tStats"></div>
  </div>
  <div class="by">a <a href="../index.html">BitPillars</a> game</div>
</div>

<div class="screen dim hidden" id="levels">
  <h2 class="jersey" style="margin:0;font-size:44px;letter-spacing:3px;color:var(--cyan)">ROOMS</h2>
  <div id="grid"></div>
  <button id="lBack">BACK</button>
</div>

<div class="screen dim hidden" id="pause">
  <div class="card">
    <h2 class="jersey">PAUSED</h2>
    <button class="big" id="pResume">RESUME</button>
    <div class="row"><button id="pReset">RESET ROOM</button><button id="pLevels">ROOMS</button></div>
    <div class="row"><button id="pSfx">SFX</button><button id="pMusic">MUSIC</button></div>
    <button id="pTitle">TITLE</button>
    <p class="small" style="font-size:10px">KEYS: ARROWS/WASD · JUMP UP/W/SPACE · ECHO DOWN/S/X · R RESET</p>
  </div>
</div>

<div class="screen dim hidden" id="clear">
  <div class="card">
    <h2 class="jersey" id="cTitle">CLEAR</h2>
    <p id="cInfo"></p>
    <div class="row"><button id="cRetry">RETRY</button><button class="big" id="cNext">NEXT</button></div>
  </div>
</div>

<div class="screen hidden" id="ending">
  <h2 class="jersey">ECHO</h2>
  <p id="eInfo"></p>
  <div class="menu">
    <div class="row"><button id="eLevels">ROOMS</button><button id="eTitle">TITLE</button></div>
    <button class="big" id="eBP">MORE BITPILLARS GAMES</button>
  </div>
</div>

<script>
// ECHO engine: ten-second rooms. Every life you lose leaves a frozen echo you can stand on.
// Pure logic, no DOM. Fixed 60 Hz steps, deterministic, shared by the browser and Node.
(function (root) {
  const T = 8, W = 20, H = 13;                 // tile size, room size in tiles
  const PW = 6, PH = 7;                         // player hitbox
  const RUN = 1.2, GRAV = 0.22, MAXFALL = 3.4, JUMP = 3.0, CUT = 1.0;
  const COYOTE = 5, BUFFER = 6, LIFE = 600;     // frames (10 s)

  // Legend: # wall  ^ spikes  v ceiling spikes  S start  E exit  p plate  G gate (open while every plate is held down)
  const LEVELS = [
    { name: 'First Steps', cap: 3, hint: 'Arrows or A/D to move, Up/W/Space to jump. Reach the door.', touchHint: 'Hold the arrows to move, JUMP to jump. Reach the door.', map: [
      '####################', '#..................#', '#..................#', '#..................#', '#..................#', '#..................#',
      '#..................#', '#..................#', '#..................#', '#...........##.....#', '#S.....#....##...E.#', '#####...############', '#####...############'] },
    { name: 'Too High', cap: 3, hint: 'Too high? Press Down (or wait ten seconds) to freeze. Your echo stays. Stand on it.', touchHint: 'Too high? Tap ECHO (or wait ten seconds) to freeze. Your echo stays. Stand on it.', map: [
      '####################', '#..................#', '#..................#', '#..................#', '#..................#', '#..................#',
      '#..................#', '#..................#', '#.........##.......#', '#.........##.......#', '#S........##....E..#', '####################', '####################'] },
    { name: 'Spikes', cap: 4, hint: 'Spikes end a life, but your echo covers the spike.', map: [
      '####################', '#..................#', '#..................#', '#..................#', '#..................#', '#..................#',
      '#..................#', '#..................#', '#..................#', '#..................#', '#S...^^^^^^^^^...E.#', '####################', '####################'] },
    { name: "Echoes Don't Fall", cap: 4, hint: 'Freeze in mid-air. Echoes stay exactly where you leave them.', map: [
      '####################', '#..................#', '#..................#', '#..................#', '#..................#', '#..................#',
      '#..................#', '#..................#', '#..................#', '#..................#', '#S..............E..#', '#####.........######', '#####.........######'] },
    { name: 'Plate', cap: 3, hint: 'A gold plate opens the gate while something holds it down.', map: [
      '####################', '#.............#....#', '#.............#....#', '#.............#....#', '#.............#....#', '#.............#....#',
      '#.............#....#', '#.............#....#', '#.............#....#', '#.............G..E.#', '#S.p..........G....#', '####################', '####################'] },
    { name: 'Higher', cap: 4, hint: 'Build a staircase out of yourself.', map: [
      '####################', '#..................#', '#.............E....#', '#...........########', '#..................#', '#..................#',
      '#..................#', '#..................#', '#..................#', '#..................#', '#S.................#', '####################', '####################'] },
    { name: 'Two Plates', cap: 3, hint: 'Only three echoes can stay. The oldest one fades first.', map: [
      '####################', '#..............#...#', '#..............#...#', '#..............#...#', '#..............#...#', '#.p............#...#',
      '#######........#...#', '#..............#...#', '#..............#...#', '#..............G...#', '#S..p..........G.E.#', '####################', '####################'] },
    { name: 'Low Ceiling', cap: 6, hint: 'No room to jump. Pave the way.', map: [
      '####################', '#....#########.....#', '#....#########.....#', '#....#########.....#', '#....#########.....#', '#....#########.....#',
      '#....#########.....#', '#....#########.....#', '#....vvvvvvvvv.....#', '#..................#', '#S....^^^^^......E.#', '####################', '####################'] },
    { name: 'Gatekeeper', cap: 4, hint: 'The plate is on the pillar. The door is past the gate.', map: [
      '####################', '#................#.#', '#................#.#', '#................#.#', '#................#.#', '#................#.#',
      '#..........p.....#.#', '#.........###....#.#', '#.........###....#.#', '#.........###....G.#', '#S..^^^^^^###^^^.GE#', '####################', '####################'] },
    { name: 'Seven', cap: 7, hint: 'Only seven echoes can stay. Make every one count.', map: [
      '####################', '#..............G.E.#', '#..............#####', '#..................#', '#..................#', '#..................#',
      '#..................#', '#..................#', '#..................#', '#..................#', '#S.................#', '###p####p####p######', '####################'] },
  ];

  function parse(def) {
    const rows = def.map.slice();
    while (rows.length < H) rows.unshift('#' + '.'.repeat(W - 2) + '#');
    const tiles = new Uint8Array(W * H);         // 0 air, 1 wall, 2 spike, 3 exit, 4 plate, 5 gate
    let sx = 1, sy = 1; const plates = [], gates = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      const ch = (rows[r] || '')[c] || '#', k = r * W + c;
      if (ch === '#') tiles[k] = 1;
      else if (ch === '^') tiles[k] = 2;
      else if (ch === 'v') tiles[k] = 6;
      else if (ch === 'E') tiles[k] = 3;
      else if (ch === 'p') { tiles[k] = 4; plates.push(k); }
      else if (ch === 'G') { tiles[k] = 5; gates.push(k); }
      else if (ch === 'S') { sx = c; sy = r; }
    }
    return Object.assign({ cap: 99, par: 0, hint: '' }, def, { tiles, sx, sy, plates, gates });
  }

  function newRun(L) {
    const st = { echoes: [], lives: 1, deaths: 0, won: false, frame: 0 };
    spawn(L, st); st.wasOpen = platesHeld(L, st, st.x, st.y);
    return st;
  }
  function spawn(L, st) {
    st.x = L.sx * T + 1; st.y = L.sy * T + (T - PH); st.vy = 0;
    st.ground = true; st.coyote = COYOTE; st.buf = 0; st.held = false; st.face = 1; st.t = 0; st.cutOk = false;
    st.alive = true;
  }

  const key = (c, r) => r * W + c;
  function echoAt(st, k) { for (let i = 0; i < st.echoes.length; i++) if (st.echoes[i].k === k) return i; return -1; }
  function platesHeld(L, st, px, py) {
    if (!L.plates.length) return true;
    for (const k of L.plates) {
      if (echoAt(st, k) >= 0) continue;
      const c = k % W, r = (k / W) | 0;                                   // the player standing on it counts too
      if (px !== undefined && px + PW > c * T && px < c * T + T && py + PH > r * T + 4 && py < r * T + T) continue;
      return false;
    }
    return true;
  }
  function solidAt(L, st, c, r, open) {
    if (c < 0 || c >= W) return true;
    if (r < 0) return true;
    if (r >= H) return false;
    const k = r * W + c, t = L.tiles[k];
    if (t === 1) return true;
    if (t === 5 && !open) return true;
    return echoAt(st, k) >= 0;
  }
  function boxHits(L, st, x, y, open) {
    const c0 = Math.floor(x / T), c1 = Math.floor((x + PW - 0.001) / T);
    const r0 = Math.floor(y / T), r1 = Math.floor((y + PH - 0.001) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(L, st, c, r, open)) return true;
    return false;
  }
  function overlapGate(L, st) {
    const c0 = Math.floor(st.x / T), c1 = Math.floor((st.x + PW - 0.001) / T);
    const r0 = Math.floor(st.y / T), r1 = Math.floor((st.y + PH - 0.001) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (r >= 0 && r < H && L.tiles[r * W + c] === 5) return true;
    return false;
  }

  // place an echo in cell k; returns the event
  function addEcho(L, st, k, cause) {
    const c = k % W, r = (k / W) | 0;
    if (r < 0 || r >= H || (c === L.sx && r === L.sy) || L.tiles[k] === 1 || L.tiles[k] === 3 || echoAt(st, k) >= 0) return { type: 'noecho', cause };
    st.echoes.push({ k, c, r, cause, pose: st.face, born: st.frame });
    let faded = null;
    if (st.echoes.length > L.cap) faded = st.echoes.shift();
    return { type: 'echo', cause, c, r, faded };
  }
  function centerCell(st) { return key(Math.floor((st.x + PW / 2) / T), Math.floor((st.y + PH / 2) / T)); }

  function endLife(L, st, ev, cause, k) {
    st.alive = false; st.deaths++;
    if (k !== undefined) ev.push(addEcho(L, st, k, cause)); else ev.push({ type: 'lost', cause });
    ev.push({ type: 'die', cause, x: st.x, y: st.y });
    st.lives++;
    spawn(L, st);
    ev.push({ type: 'spawn' });
  }

  // input: { dir: -1|0|1, jump: bool (held), echo: bool (pressed this frame) }
  function step(L, st, input) {
    const ev = [];
    if (st.won) return ev;
    st.frame++; st.t++;
    const dir = input.dir | 0;
    if (dir) st.face = dir;
    // gates: open while held; a closing gate never closes on top of you
    const open = platesHeld(L, st, st.x, st.y) || (st.wasOpen && overlapGate(L, st));
    if (open !== st.wasOpen) ev.push({ type: open ? 'gateopen' : 'gateclose' });
    st.wasOpen = open;
    if (input.echo) { endLife(L, st, ev, 'echo', centerCell(st)); return ev; }

    // horizontal
    const nx = st.x + dir * RUN;
    if (!boxHits(L, st, nx, st.y, open)) st.x = nx;
    else if (dir > 0) st.x = Math.floor((st.x + PW + RUN) / T) * T - PW;           // snug against the wall
    else if (dir < 0) st.x = Math.floor((st.x - RUN) / T) * T + T;
    if (boxHits(L, st, st.x, st.y, open)) st.x = nx - dir * RUN;                   // safety: never end inside

    // jump: buffered press, coyote time, variable height
    const press = input.jump && !st.held; st.held = !!input.jump;
    if (press) st.buf = BUFFER; else if (st.buf) st.buf--;
    if (st.buf && (st.ground || st.coyote > 0)) { st.vy = -JUMP; st.buf = 0; st.coyote = 0; st.ground = false; st.cutOk = true; ev.push({ type: 'jump' }); }
    if (!st.held && st.cutOk && st.vy < -CUT) { st.vy = -CUT; st.cutOk = false; }
    if (st.vy >= 0) st.cutOk = false;

    // vertical
    st.vy = Math.min(MAXFALL, st.vy + GRAV);
    const ny = st.y + st.vy;
    const wasGround = st.ground;
    if (!boxHits(L, st, st.x, ny, open)) { st.y = ny; st.ground = false; }
    else if (st.vy > 0) { st.y = Math.floor((ny + PH) / T) * T - PH; st.vy = 0; st.ground = true; if (!wasGround) ev.push({ type: 'land' }); }
    else { st.y = Math.floor(ny / T) * T + T; st.vy = 0; ev.push({ type: 'bonk' }); }
    if (st.ground) st.coyote = COYOTE; else if (st.coyote > 0) st.coyote--;
    // standing check (walking off a ledge)
    if (st.ground && !boxHits(L, st, st.x, st.y + 0.5, open)) st.ground = false;

    // fell out of the room
    if (st.y > H * T + 4) { endLife(L, st, ev, 'fall'); return ev; }
    // spikes: the echo covers the spike that got you
    const c0 = Math.floor(st.x / T), c1 = Math.floor((st.x + PW - 0.001) / T);
    const r0 = Math.floor(st.y / T), r1 = Math.floor((st.y + PH - 0.001) / T);
    let spike = -1, best = -1;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const tk = r >= 0 && r < H ? L.tiles[r * W + c] : 0;
      if ((tk !== 2 && tk !== 6) || echoAt(st, r * W + c) >= 0) continue;
      const ox = Math.min(st.x + PW, c * T + T - 1) - Math.max(st.x, c * T + 1);
      const hit = tk === 2 ? st.y + PH > r * T + 4.5 : st.y < r * T + 3.5;
      if (hit && ox > 0.5 && ox > best) { best = ox; spike = r * W + c; }
    }
    if (spike >= 0) { endLife(L, st, ev, 'spike', spike); return ev; }
    // exit
    const ck = centerCell(st);

  if (down) { g.globalAlpha = 0.25; g.fillRect(px - 1, py + 3, 10, 5); g.globalAlpha = 1; }
}
function drawGate(px, py, open, now, c, r) {
  const k = r * W + c; G.gateT = G.gateT || {}; const cur = G.gateT[k] === undefined ? (open ? 1 : 0) : G.gateT[k];
  const nxt = cur + ((open ? 1 : 0) - cur) * 0.25; G.gateT[k] = nxt;
  const h = Math.round(8 * (1 - nxt));
  g.fillStyle = '#5a4316'; g.fillRect(px, py, 1, 8); g.fillRect(px + 7, py, 1, 8);
  if (h > 0) { for (let i = 0; i < 3; i++) { g.fillStyle = '#ffcf5a'; g.fillRect(px + 1 + i * 2 + (i ? 1 : 0), py, 1, h); } g.fillStyle = '#c97a18'; g.fillRect(px + 1, py + h - 1, 6, 1); }
}
// an 8x8 figure: a small hooded traveller with a glowing visor
const FIG = ['..XXXX..', '.XXXXXX.', '.XVVVVX.', '.XXXXXX.', 'XXXXXXXX', '.XXXXXX.', '.XX..XX.', '.X....X.'];
function drawFig(x, y, face, body, visor, alpha) {
  const a0 = g.globalAlpha; g.globalAlpha = a0 * (alpha === undefined ? 1 : alpha);
  for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
    const ch = FIG[j][face < 0 ? 7 - i : i];
    if (ch === 'X') { g.fillStyle = body; g.fillRect(x + i, y + j, 1, 1); }
    else if (ch === 'V') { g.fillStyle = visor; g.fillRect(x + i, y + j, 1, 1); }
  }
  g.globalAlpha = a0;
}
function drawPlayer(x, y, st, now, left) {
  const blink = left < 3 && Math.floor(now / (left < 1.5 ? 70 : 140)) % 2;
  const air = !st.ground;
  g.globalAlpha = 0.2; g.fillStyle = '#8ff0ff'; g.fillRect(x - 1, y + 1, 10, 7); g.globalAlpha = 1;
  drawFig(x, y, st.face, blink ? '#ffd6ea' : '#f4efe6', '#16a6c4');
  g.fillStyle = '#8ff0ff'; g.fillRect(x + (st.face > 0 ? 5 : 2), y + 2, 1, 1);
  if (air) { g.fillStyle = '#f4efe6'; g.fillRect(x + 1, y + 7, 1, 1); g.fillRect(x + 6, y + 7, 1, 1); }
  else if (Math.abs(st.x - G.prev.x) > 0.1 && Math.floor(now / 110) % 2) { g.fillStyle = '#f4efe6'; g.fillRect(x + 3, y + 7, 2, 1); }
}
function drawEcho(x, y, face, now, k, warn, i, dying) {
  const flick = warn && Math.floor(now / 200) % 2;
  const a = (dying ? k : Math.min(1, k * 1.2)) * (flick ? 0.45 : 1);
  g.globalAlpha = a * (0.16 + 0.06 * Math.sin(now / 500 + i)); g.fillStyle = '#8ff0ff'; g.fillRect(x - 1, y - 1, 10, 10);
  g.globalAlpha = a * 0.7; g.fillStyle = '#10304d'; g.fillRect(x, y, 8, 8);
  g.globalAlpha = 1;
  drawFig(x, y, face, '#8ff0ff', '#10304d', a * 0.95);
  g.globalAlpha = a; g.fillStyle = '#e6fdff'; g.fillRect(x, y, 8, 1);                       // the top you can stand on
  g.fillStyle = '#8ff0ff'; g.fillRect(x, y + 7, 1, 1); g.fillRect(x + 7, y + 7, 1, 1);
  g.globalAlpha = 1;
  if (k < 1 && !dying) { g.globalAlpha = 1 - k; g.fillStyle = '#ffffff'; g.fillRect(x - 1, y - 1, 10, 10); g.globalAlpha = 1; }
}
// title: a line of echoes and the traveller
function renderEmblem(now) {
  const r = $('emblem').getBoundingClientRect();
  const cx = Math.round((r.left + r.width / 2) * DPR / S), by = Math.round((r.top + r.height) * DPR / S) - 4;
  g.fillStyle = '#2b2748'; g.fillRect(cx - 34, by + 8, 68, 2); g.fillStyle = '#7d75c4'; g.fillRect(cx - 34, by + 8, 68, 1);
  for (let i = 0; i < 4; i++) {
    drawFig(cx + 10 - i * 12, by, 1, '#bff7ff', '#ffffff', 0.6 - i * 0.13);
  }
  const hop = Math.max(0, Math.sin(now / 420)) * 8;
  drawFig(cx + 26 - 4, by - Math.round(hop), 1, '#f4efe6', '#16a6c4');
}
// ending: every echo you left behind walks home together
function renderCredits(now, dt) {
  const C = G.credits; if (!C) return;
  const Wl = lo.width, Hl = lo.height, ground = Math.round(Hl * 0.78);
  C.t += dt;
  g.fillStyle = '#2b2748'; g.fillRect(0, ground, Wl, Hl - ground); g.fillStyle = '#7d75c4'; g.fillRect(0, ground, Wl, 1);
  for (let x = 0; x < Wl; x += 6) { const h = hsh(x, 3); if (h % 3 === 0) { g.fillStyle = '#5fd39a'; g.fillRect(x, ground - 1, 1, 1); } }
  // the gold door far right
  const dx = Wl - 18; drawExit(dx, ground - 8, now);
  const speed = 14, gap = 11;
  const lead = -10 + C.t * speed;
  for (let i = C.n; i >= 0; i--) {
    const x = Math.round(lead - i * gap), bob = Math.floor((now / 160 + i) % 2);
    if (x < -10 || x > dx + 2) continue;
    if (i === 0) drawFig(x, ground - 8 - bob, 1, '#f4efe6', '#16a6c4');
    else drawFig(x, ground - 8 - bob, 1, '#bff7ff', '#ffffff', 0.35 + 0.35 * ((i * 37) % 10) / 10);
  }
  if (lead - C.n * gap > dx + 2 && !C.doneAt) C.doneAt = now;
  if (C.doneAt) { const k = Math.min(1, (now - C.doneAt) / 2500); g.globalAlpha = 0.25 * k; g.fillStyle = '#ffcf5a'; g.fillRect(dx - 6, ground - 20, 20, 20); g.globalAlpha = 1; }
}

// ---------------- screens ----------------
function show(id) {
  for (const s of ['title', 'levels', 'pause', 'clear', 'ending']) $(s).classList.toggle('hidden', s !== id);
  const playing = G.mode === 'play' || G.mode === 'pause' || G.mode === 'clear';
  $('hud').classList.toggle('hidden', !playing); $('ctrl').classList.toggle('hidden', !playing || id !== null);
  $('cap').classList.toggle('hidden', !playing || id !== null);
  $('pad').classList.toggle('hidden', !touch || G.mode !== 'play' || id !== null);
  if (id === 'title') refreshTitle();
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1100); }
function fmt(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); }
function refreshTitle() {
  for (const p of ['t', 'p']) { $(p + 'Sfx').textContent = 'SFX ' + (save.sfx ? 'ON' : 'OFF'); $(p + 'Music').textContent = 'MUSIC ' + (save.music ? 'ON' : 'OFF'); }
  $('tPlay').textContent = save.cleared >= 0 && !save.finished ? 'CONTINUE' : 'PLAY';
  $('tStats').textContent = save.finished ? 'ALL ' + LEVELS.length + ' ROOMS · ' + save.totalEchoes + ' ECHOES LEFT BEHIND' : (save.cleared + 1) + ' / ' + LEVELS.length + ' ROOMS';
}
function buildGrid() {
  const gr = $('grid'); gr.innerHTML = '';
  LEVELS.forEach((d, i) => {
    const b = document.createElement('button'), locked = i > save.cleared + 1;
    const best = save.best[i];
    b.innerHTML = `<span class="n">${locked ? '·' : i + 1}</span><span class="t">${locked ? '' : (best !== undefined ? best + ' ECHO' + (best === 1 ? '' : 'ES') : d.name.toUpperCase())}</span>`;
    if (i <= save.cleared) b.classList.add('done');
    if (locked) b.disabled = true; else b.onclick = () => { SFX.click(); startRoom(i); };
    gr.appendChild(b);
  });
}
function openPause() { if (G.mode !== 'play') return; IN.l = IN.r = IN.jump = false; G.mode = 'pause'; refreshTitle(); show('pause'); }
function resume() { G.mode = 'play'; show(null); last = performance.now(); }
function roomDone() {
  const i = G.idx, st = G.st, used = st.echoes.length, lives = st.lives;
  save.cleared = Math.max(save.cleared, i); save.time += G.roomTime;
  if (save.best[i] === undefined || used < save.best[i]) save.best[i] = used;
  save.totalEchoes += lives - 1; persist();
  if (i === LEVELS.length - 1) { finish(); return; }
  $('cTitle').textContent = 'CLEAR';
  $('cInfo').innerHTML = `${LEVELS[i].name.toUpperCase()}<br>ECHOES STANDING ${used} · BEST ${save.best[i]}<br>LIVES ${lives} · TIME ${fmt(G.roomTime)}`;
  $('cNext').textContent = i === LEVELS.length - 2 ? 'THE LAST ROOM' : 'NEXT';
  G.mode = 'clear'; show('clear');
}
function finish() {
  save.finished = true; persist();
  const n = Math.max(7, save.totalEchoes);
  G.credits = { t: 0, n: Math.min(n, 120), doneAt: 0 };
  $('eInfo').innerHTML = `Every life you lost stayed behind to hold you up.<br>${save.totalEchoes} echoes. Every one of them was you.<br>Now they get to go home too.<br><br>TOTAL TIME ${fmt(save.time)}`;
  G.mode = 'ending'; G.L = null; show('ending');
}

const tap = (id, fn) => $(id).addEventListener('click', e => { audio(); SFX.click(); fn(e); });
tap('tPlay', () => startRoom(save.finished ? 0 : Math.min(save.cleared + 1, LEVELS.length - 1)));
tap('tLevels', () => { buildGrid(); show('levels'); });
tap('tSfx', () => { save.sfx = !save.sfx; if (sfxG) sfxG.gain.value = save.sfx ? 1 : 0; persist(); refreshTitle(); });
tap('tMusic', () => { save.music = !save.music; if (musG) musG.gain.value = save.music ? 0.16 : 0; persist(); refreshTitle(); });
tap('pSfx', () => $('tSfx').click());
tap('pMusic', () => $('tMusic').click());
tap('lBack', () => { G.mode = 'title'; G.L = null; show('title'); });
tap('bMenu', openPause);
tap('bReset', resetRoom);
tap('pResume', resume);
tap('pReset', () => { G.mode = 'play'; resetRoom(); });
tap('pLevels', () => { G.mode = 'title'; G.L = null; buildGrid(); show('levels'); });
tap('pTitle', () => { G.mode = 'title'; G.L = null; show('title'); });
tap('cRetry', () => startRoom(G.idx));
tap('cNext', () => startRoom(Math.min(G.idx + 1, LEVELS.length - 1)));
tap('eLevels', () => { G.mode = 'title'; G.L = null; buildGrid(); show('levels'); });
tap('eTitle', () => { G.mode = 'title'; G.L = null; show('title'); });
tap('eBP', () => { location.href = '../index.html'; });

fit(); show('title'); requestAnimationFrame(frame);
window.__G = G; window.__IN = IN; window.__EC = EC; window.__view = () => ({ S, DPR, ox, oy });
})();
</script>
